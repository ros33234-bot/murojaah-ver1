// Sumber teks: Mushaf Utsmani, terjemahan Kemenag RI (id) dan Sahih International (en) via paket quran-json (quranenc.com).
const D=[{"n":"An-Naba","a":[["عَمَّ يَتَسَآءَلُونَ","Tentang apakah mereka saling bertanya-tanya","About what are they asking one another"],["عَنِ ٱلنَّبَإِ ٱلْعَظِيمِ","Tentang berita yang besar (hari berbangkit)","About the great news"],["ٱلَّذِي هُمْ فِيهِ مُخْتَلِفُونَ","yang dalam hal itu mereka berselisih","That over which they are in disagreement"],["كَلَّا سَيَعْلَمُونَ","(Tidak!892) Kelak mereka akan mengetahui","No! They are going to know"],["ثُمَّ كَلَّا سَيَعْلَمُونَ","sekali lagi tidak! Kelak mereka akan mengetahui","Then, no! They are going to know"],["أَلَمْ نَجْعَلِ ٱلْأَرْضَ مِهَـٰدًا","Bukankah Kami telah menjadikan bumi sebagai hamparan","Have We not made the earth a resting place"],["وَٱلْجِبَالَ أَوْتَادًا","dan gunung-gunung sebagai pasak","And the mountains as stakes"],["وَخَلَقْنَـٰكُمْ أَزْوَـٰجًا","Dan Kami menciptakan kamu berpasang-pasangan","And We created you in pairs"],["وَجَعَلْنَا نَوْمَكُمْ سُبَاتًا","dan Kami menjadikan tidurmu untuk istirahat","And made your sleep [a means for] rest"],["وَجَعَلْنَا ٱلَّيْلَ لِبَاسًا","dan Kami menjadikan malam sebagai pakaian","And made the night as clothing"],["وَجَعَلْنَا ٱلنَّهَارَ مَعَاشًا","dan Kami menjadikan siang untuk mencari penghidupan","And made the day for livelihood"],["وَبَنَيْنَا فَوْقَكُمْ سَبْعًا شِدَادًا","dan Kami membangun di atas kamu tujuh (lapis langit) yang kokoh","And constructed above you seven strong [heavens]"],["وَجَعَلْنَا سِرَاجًا وَهَّاجًا","dan Kami menjadikan pelita yang terang-benderang (matahari)","And made [therein] a burning lamp"],["وَأَنزَلْنَا مِنَ ٱلْمُعْصِرَـٰتِ مَآءً ثَجَّاجًا","dan Kami turunkan dari awan, air hujan yang tercurah dengan lebatnya","And sent down, from the rain clouds, pouring water"],["لِّنُخْرِجَ بِهِۦ حَبًّا وَنَبَاتًا","untuk Kami tumbuhkan dengan air itu biji-bijian dan tanam-tanaman","That We may bring forth thereby grain and vegetation"],["وَجَنَّـٰتٍ أَلْفَافًا","dan kebun-kebun yang rindang","And gardens of entwined growth"],["إِنَّ يَوْمَ ٱلْفَصْلِ كَانَ مِيقَـٰتًا","Sungguh, hari keputusan adalah suatu waktu yang telah ditetapkan","Indeed, the Day of Judgement is an appointed time"],["يَوْمَ يُنفَخُ فِي ٱلصُّورِ فَتَأْتُونَ أَفْوَاجًا","(yaitu) pada hari (ketika) sangkakala ditiup, lalu kamu datang berbondong-bondong","The Day the Horn is blown and you will come forth in multitudes"],["وَفُتِحَتِ ٱلسَّمَآءُ فَكَانَتْ أَبْوَـٰبًا","dan langit pun dibukalah, maka terdapatlah beberapa pintu","And the heaven is opened and will become gateways"],["وَسُيِّرَتِ ٱلْجِبَالُ فَكَانَتْ سَرَابًا","dan gunung-gunungpun dijalankan sehingga menjadi fatamorgana","And the mountains are removed and will be [but] a mirage"],["إِنَّ جَهَنَّمَ كَانَتْ مِرْصَادًا","Sungguh, (neraka) Jahanam itu (sebagai) tempat mengintai (bagi penjaga yang mengawasi isi neraka)","Indeed, Hell has been lying in wait"],["لِّلطَّـٰغِينَ مَـَٔابًا","menjadi tempat kembali bagi orang-orang yang melampaui batas","For the transgressors, a place of return"],["لَّـٰبِثِينَ فِيهَآ أَحْقَابًا","Mereka tinggal di sana dalam masa yang lama","In which they will remain for ages [unending]"],["لَّا يَذُوقُونَ فِيهَا بَرْدًا وَلَا شَرَابًا","mereka tidak merasakan kesejukan di dalamnya dan tidak (pula mendapat) minuman","They will not taste therein [any] coolness or drink"],["إِلَّا حَمِيمًا وَغَسَّاقًا","selain air yang mendidih dan nanah","Except scalding water and [foul] purulence"],["جَزَآءً وِفَاقًا","sebagai pembalasan yang setimpal","An appropriate recompense"],["إِنَّهُمْ كَانُواْ لَا يَرْجُونَ حِسَابًا","Sesungguhnya dahulu mereka tidak pernah mengharapkan perhitungan","Indeed, they were not expecting an account"],["وَكَذَّبُواْ بِـَٔايَـٰتِنَا كِذَّابًا","dan mereka benar-benar mendustakan ayat-ayat Kami","And denied Our verses with [emphatic] denial"],["وَكُلَّ شَيْءٍ أَحْصَيْنَـٰهُ كِتَـٰبًا","Dan segala sesuatu telah Kami catat dalam suatu Kitab (buku catatan amalan manusia)","But all things We have enumerated in writing"],["فَذُوقُواْ فَلَن نَّزِيدَكُمْ إِلَّا عَذَابًا","Maka karena itu rasakanlah! Maka tidak ada yang akan Kami tambahkan kepadamu selain azab","So taste [the penalty], and never will We increase you except in torment"],["إِنَّ لِلْمُتَّقِينَ مَفَازًا","Sungguh, orang-orang yang bertakwa mendapat kemenangan","Indeed, for the righteous is attainment"],["حَدَآئِقَ وَأَعْنَـٰبًا","(yaitu) kebun-kebun dan buah anggur","Gardens and grapevines"],["وَكَوَاعِبَ أَتْرَابًا","dan gadis-gadis belia yang sebaya","And full-breasted [companions] of equal age"],["وَكَأْسًا دِهَاقًا","dan gelas-gelas yang penuh (berisi minuman)","And a full cup"],["لَّا يَسْمَعُونَ فِيهَا لَغْوًا وَلَا كِذَّـٰبًا","Di sana mereka tidak mendengar percakapan yang sia-sia maupun (perkataan dusta)","No ill speech will they hear therein or any falsehood"],["جَزَآءً مِّن رَّبِّكَ عَطَآءً حِسَابًا","Sebagai balasan dan pemberian yang cukup banyak dari Tuhanmu","[As] reward from your Lord, [a generous] gift [made due by] account"],["رَّبِّ ٱلسَّمَـٰوَـٰتِ وَٱلْأَرْضِ وَمَا بَيْنَهُمَا ٱلرَّحْمَـٰنِۖ لَا يَمْلِكُونَ مِنْهُ خِطَابًا","Tuhan (yang memelihara) langit dan bumi serta apa yang ada di antara keduanya; Yang Maha Pengasih, mereka tidak mampu berbicara dengan Dia","[From] the Lord of the heavens and the earth and whatever is between them, the Most Merciful. They possess not from Him [authority for] speech"],["يَوْمَ يَقُومُ ٱلرُّوحُ وَٱلْمَلَـٰٓئِكَةُ صَفًّاۖ لَّا يَتَكَلَّمُونَ إِلَّا مَنْ أَذِنَ لَهُ ٱلرَّحْمَـٰنُ وَقَالَ صَوَابًا","(Pada hari, ketika rūḥ894) dan para malaikat berdiri bersaf-saf, mereka tidak berkata-kata, kecuali siapa yang telah diberi izin kepadanya oleh Tuhan Yang Maha Pengasih dan dia hanya mengatakan yang benar","The Day that the Spirit and the angels will stand in rows, they will not speak except for one whom the Most Merciful permits, and he will say what is correct"],["ذَـٰلِكَ ٱلْيَوْمُ ٱلْحَقُّۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ مَـَٔابًا","Itulah hari yang pasti terjadi. Maka barangsiapa menghendaki, niscaya dia menempuh jalan kembali kepada Tuhannya","That is the True Day; so he who wills may take to his Lord a [way of] return"],["إِنَّآ أَنذَرْنَـٰكُمْ عَذَابًا قَرِيبًا يَوْمَ يَنظُرُ ٱلْمَرْءُ مَا قَدَّمَتْ يَدَاهُ وَيَقُولُ ٱلْكَافِرُ يَـٰلَيْتَنِي كُنتُ تُرَـٰبَۢا","Sesungguhnya Kami telah memperingatkan kepadamu (orang kafir) azab yang dekat, pada hari manusia melihat apa yang telah diperbuat oleh kedua tangannya; dan orang kafir berkata, \"Alangkah baiknya seandainya dahulu aku jadi tanah","Indeed, We have warned you of a near punishment on the Day when a man will observe what his hands have put forth and the disbeliever will say, \"Oh, I wish that I were dust"]]},{"n":"An-Nazi'at","a":[["وَٱلنَّـٰزِعَـٰتِ غَرْقًا","Demi (malaikat) yang mencabut (nyawa) dengan keras","By those [angels] who extract with violence"],["وَٱلنَّـٰشِطَـٰتِ نَشْطًا","Demi (malaikat) yang mencabut (nyawa) dengan lemah lembut","And [by] those who remove with ease"],["وَٱلسَّـٰبِحَـٰتِ سَبْحًا","Demi (malaikat) yang turun dari langit dengan cepat","And [by] those who glide [as if] swimming"],["فَٱلسَّـٰبِقَـٰتِ سَبْقًا","dan (malaikat) yang mendahului dengan kencang","And those who race each other in a race"],["فَٱلْمُدَبِّرَـٰتِ أَمْرًا","dan (malaikat) yang mengatur urusan (dunia)","And those who arrange [each] matter"],["يَوْمَ تَرْجُفُ ٱلرَّاجِفَةُ","(Sungguh, kamu akan dibangkitkan) pada hari ketika tiupan pertama mengguncangkan alam","On the Day the blast [of the Horn] will convulse [creation]"],["تَتْبَعُهَا ٱلرَّادِفَةُ","(tiupan pertama) itu diiringi oleh tiupan kedua","There will follow it the subsequent [one]"],["قُلُوبٌ يَوْمَئِذٍ وَاجِفَةٌ","Hati manusia pada waktu itu merasa sangat takut","Hearts, that Day, will tremble"],["أَبْصَـٰرُهَا خَـٰشِعَةٌ","pandangannya tunduk","Their eyes humbled"],["يَقُولُونَ أَءِنَّا لَمَرْدُودُونَ فِي ٱلْحَافِرَةِ","(orang-orang kafir) berkata, \"Apakah kita benar-benar akan dikembalikan kepada kehidupan yang semula","They are [presently] saying, \"Will we indeed be returned to [our] former state [of life]"],["أَءِذَا كُنَّا عِظَـٰمًا نَّخِرَةً","Apakah (akan dibangkitkan juga) apabila kita telah menjadi tulang belulang yang hancur","Even if we should be decayed bones"],["قَالُواْ تِلْكَ إِذًا كَرَّةٌ خَاسِرَةٌ","Mereka berkata, \"Kalau demikian, itu adalah suatu pengembalian yang merugikan","They say, \"That, then, would be a losing return"],["فَإِنَّمَا هِيَ زَجْرَةٌ وَـٰحِدَةٌ","Maka pengembalian itu hanyalah dengan sekali tiupan saja","Indeed, it will be but one shout"],["فَإِذَا هُم بِٱلسَّاهِرَةِ","Maka seketika itu mereka hidup kembali di bumi (yang baru)","And suddenly they will be [alert] upon the earth's surface"],["هَلْ أَتَىٰكَ حَدِيثُ مُوسَىٰٓ","Sudahkah sampai kepadamu (Muhammad) kisah Musa","Has there reached you the story of Moses"],["إِذْ نَادَىٰهُ رَبُّهُۥ بِٱلْوَادِ ٱلْمُقَدَّسِ طُوًى","Ketika Tuhan memanggilnya (Musa) di lembah suci yaitu Lembah Tuwa","When his Lord called to him in the sacred valley of Tuwa"],["ٱذْهَبْ إِلَىٰ فِرْعَوْنَ إِنَّهُۥ طَغَىٰ","pergilah engkau kepada Fir'aun! Sesungguhnya dia telah melampaui batas","Go to Pharaoh. Indeed, he has transgressed"],["فَقُلْ هَل لَّكَ إِلَىٰٓ أَن تَزَكَّىٰ","Maka katakanlah (kepada Fir'aun), \"Adakah keinginanmu untuk membersihkan diri (dari kesesatan)","And say to him, 'Would you [be willing to] purify yourself"],["وَأَهْدِيَكَ إِلَىٰ رَبِّكَ فَتَخْشَىٰ","dan engkau akan kubimbing ke jalan Tuhanmu agar engkau takut kepada-Nya","And let me guide you to your Lord so you would fear [Him]"],["فَأَرَىٰهُ ٱلْأٓيَةَ ٱلْكُبْرَىٰ","Lalu (Musa) memperlihatkan kepadanya mukjizat yang besar","And he showed him the greatest sign"],["فَكَذَّبَ وَعَصَىٰ","Tetapi dia (Fir'aun) mendustakan dan mendurhakai","But Pharaoh denied and disobeyed"],["ثُمَّ أَدْبَرَ يَسْعَىٰ","Kemudian dia berpaling seraya berusaha menantang (Musa)","Then he turned his back, striving"],["فَحَشَرَ فَنَادَىٰ","Kemudian dia mengumpulkan (pembesar-pembesarnya) lalu berseru (memanggil kaumnya)","And he gathered [his people] and called out"],["فَقَالَ أَنَا۠ رَبُّكُمُ ٱلْأَعْلَىٰ","(Seraya) berkata, \"Akulah tuhanmu yang paling tinggi","And said, \"I am your most exalted lord"],["فَأَخَذَهُ ٱللَّهُ نَكَالَ ٱلْأٓخِرَةِ وَٱلْأُولَىٰٓ","Maka Allah menghukumnya dengan azab di akhirat dan siksaan di dunia","So Allah seized him in exemplary punishment for the last and the first [transgression]"],["إِنَّ فِي ذَـٰلِكَ لَعِبْرَةً لِّمَن يَخْشَىٰٓ","Sungguh, pada yang demikian itu terdapat pelajaran bagi orang yang takut (kepada Allah)","Indeed in that is a warning for whoever would fear [Allah]"],["ءَأَنتُمْ أَشَدُّ خَلْقًا أَمِ ٱلسَّمَآءُۚ بَنَىٰهَا","Apakah penciptaan kamu yang lebih hebat ataukah langit yang telah dibangun-Nya","Are you a more difficult creation or is the heaven? Allah constructed it"],["رَفَعَ سَمْكَهَا فَسَوَّىٰهَا","Dia telah meninggikan bangunannya lalu menyempurnakannya","He raised its ceiling and proportioned it"],["وَأَغْطَشَ لَيْلَهَا وَأَخْرَجَ ضُحَىٰهَا","dan Dia menjadikan malamnya (gelap gulita), dan menjadikan siangnya (terang benderang)","And He darkened its night and extracted its brightness"],["وَٱلْأَرْضَ بَعْدَ ذَـٰلِكَ دَحَىٰهَآ","Dan setelah itu bumi Dia hamparkan","And after that He spread the earth"],["أَخْرَجَ مِنْهَا مَآءَهَا وَمَرْعَىٰهَا","Darinya Dia pancarkan mata air, dan (ditumbuhkan) tumbuh-tumbuhannya","He extracted from it its water and its pasture"],["وَٱلْجِبَالَ أَرْسَىٰهَا","Dan gunung-gunung Dia pancangkan dengan kokoh","And the mountains He set firmly"],["مَتَـٰعًا لَّكُمْ وَلِأَنْعَـٰمِكُمْ","(Semua itu) untuk kesenanganmu dan untuk hewan-hewan ternakmu","As provision for you and your grazing livestock"],["فَإِذَا جَآءَتِ ٱلطَّآمَّةُ ٱلْكُبْرَىٰ","Maka apabila malapetaka besar (hari Kiamat) telah datang","But when there comes the greatest Overwhelming Calamity"],["يَوْمَ يَتَذَكَّرُ ٱلْإِنسَـٰنُ مَا سَعَىٰ","yaitu pada hari (ketika) manusia teringat akan apa yang telah dikerjakannya","The Day when man will remember that for which he strove"],["وَبُرِّزَتِ ٱلْجَحِيمُ لِمَن يَرَىٰ","dan neraka diperlihatkan dengan jelas kepada setiap orang yang melihat","And Hellfire will be exposed for [all] those who see"],["فَأَمَّا مَن طَغَىٰ","Maka adapun orang yang melampaui batas","So as for he who transgressed"],["وَءَاثَرَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","dan lebih mengutamakan kehidupan dunia","And preferred the life of the world"],["فَإِنَّ ٱلْجَحِيمَ هِيَ ٱلْمَأْوَىٰ","maka sungguh, nerakalah tempat tinggalnya","Then indeed, Hellfire will be [his] refuge"],["وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِۦ وَنَهَى ٱلنَّفْسَ عَنِ ٱلْهَوَىٰ","Dan adapun orang-orang yang takut kepada kebesaran Tuhannya dan menahan diri dari (keinginan) hawa nafsunya","But as for he who feared the position of his Lord and prevented the soul from [unlawful] inclination"],["فَإِنَّ ٱلْجَنَّةَ هِيَ ٱلْمَأْوَىٰ","maka sungguh, surgalah tempat tinggal-(nya)","Then indeed, Paradise will be [his] refuge"],["يَسْـَٔلُونَكَ عَنِ ٱلسَّاعَةِ أَيَّانَ مُرْسَىٰهَا","Mereka (orang-orang kafir) bertanya kepadamu (Muhammad) tentang hari Kiamat, \"Kapankah terjadinya","They ask you, [O Muhammad], about the Hour: when is its arrival"],["فِيمَ أَنتَ مِن ذِكْرَىٰهَآ","Untuk apa engkau perlu menyebutkannya (waktunya)","In what [position] are you that you should mention it"],["إِلَىٰ رَبِّكَ مُنتَهَىٰهَآ","Kepada Tuhanmulah (dikembalikan) kesudahannya (ketentuan waktunya)","To your Lord is its finality"],["إِنَّمَآ أَنتَ مُنذِرُ مَن يَخْشَىٰهَا","Engkau (Muhammad) hanyalah pemberi peringatan bagi siapa yang takut kepadanya (hari Kiamat)","You are only a warner for those who fear it"],["كَأَنَّهُمْ يَوْمَ يَرَوْنَهَا لَمْ يَلْبَثُوٓاْ إِلَّا عَشِيَّةً أَوْ ضُحَىٰهَا","Pada hari ketika mereka melihat hari Kiamat itu (karena suasananya hebat), mereka merasa seakan-akan hanya (sebentar saja) tinggal (di dunia) pada waktu sore atau pagi hari","It will be, on the Day they see it, as though they had not remained [in the world] except for an afternoon or a morning thereof"]]},{"n":"'Abasa","a":[["عَبَسَ وَتَوَلَّىٰٓ","Dia (Muhammad) berwajah masam dan berpaling","The Prophet frowned and turned away"],["أَن جَآءَهُ ٱلْأَعْمَىٰ","karena seorang buta telah datang kepadanya (Abdullah bin Ummi Maktum)","Because there came to him the blind man, [interrupting]"],["وَمَا يُدْرِيكَ لَعَلَّهُۥ يَزَّكَّىٰٓ","Dan tahukah engkau (Muhammad) barangkali dia ingin menyucikan dirinya (dari dosa)","But what would make you perceive, [O Muhammad], that perhaps he might be purified"],["أَوْ يَذَّكَّرُ فَتَنفَعَهُ ٱلذِّكْرَىٰٓ","atau dia (ingin) mendapatkan pengajaran, yang memberi manfaat kepadanya","Or be reminded and the remembrance would benefit him"],["أَمَّا مَنِ ٱسْتَغْنَىٰ","Adapun orang yang merasa dirinya serba cukup (pembesar-pembesar Quraisy)","As for he who thinks himself without need"],["فَأَنتَ لَهُۥ تَصَدَّىٰ","maka engkau (Muhammad) memberi perhatian kepadanya","To him you give attention"],["وَمَا عَلَيْكَ أَلَّا يَزَّكَّىٰ","padahal tidak ada (cela) atasmu kalau dia tidak menyucikan diri (beriman)","And not upon you [is any blame] if he will not be purified"],["وَأَمَّا مَن جَآءَكَ يَسْعَىٰ","Dan adapun orang yang datang kepadamu dengan bersegera (untuk mendapatkan pengajaran)","But as for he who came to you striving [for knowledge]"],["وَهُوَ يَخْشَىٰ","sedang dia takut (kepada Allah)","While he fears [Allah]"],["فَأَنتَ عَنْهُ تَلَهَّىٰ","engkau (Muhammad) malah mengabaikannya","From him you are distracted"],["كَلَّآ إِنَّهَا تَذْكِرَةٌ","Sekali-kali jangan (begitu)! Sungguh, (ajaran-ajaran Allah) itu suatu peringatan","No! Indeed, these verses are a reminder"],["فَمَن شَآءَ ذَكَرَهُۥ","maka barangsiapa menghendaki, tentulah dia akan memperhatikannya","So whoever wills may remember it"],["فِي صُحُفٍ مُّكَرَّمَةٍ","di dalam kitab-kitab yang dimuliakan (di sisi Allah)","[It is recorded] in honored sheets"],["مَّرْفُوعَةٍ مُّطَهَّرَةِۭ","yang ditinggikan (dan) disucikan","Exalted and purified"],["بِأَيْدِي سَفَرَةٍ","di tangan para utusan (malaikat)","[Carried] by the hands of messenger-angels"],["كِرَامِۭ بَرَرَةٍ","yang mulia lagi berbakti","Noble and dutiful"],["قُتِلَ ٱلْإِنسَـٰنُ مَآ أَكْفَرَهُۥ","Celakalah manusia! Alangkah kufurnya dia","Cursed is man; how disbelieving is he"],["مِنْ أَيِّ شَيْءٍ خَلَقَهُۥ","Dari apakah Dia (Allah) menciptakannya","From what substance did He create him"],["مِن نُّطْفَةٍ خَلَقَهُۥ فَقَدَّرَهُۥ","Dari setetes mani, Dia menciptakannya lalu menentukannya","From a sperm-drop He created him and destined for him"],["ثُمَّ ٱلسَّبِيلَ يَسَّرَهُۥ","Kemudian jalannya Dia mudahkan","Then He eased the way for him"],["ثُمَّ أَمَاتَهُۥ فَأَقْبَرَهُۥ","kemudian Dia mematikannya lalu menguburkannya","Then He causes his death and provides a grave for him"],["ثُمَّ إِذَا شَآءَ أَنشَرَهُۥ","kemudian jika Dia menghendaki, Dia membangkitkannya kembali","Then when He wills, He will resurrect him"],["كَلَّا لَمَّا يَقْضِ مَآ أَمَرَهُۥ","Sekali-kali jangan (begitu)! Dia (manusia) itu belum melaksanakan apa yang Dia (Allah) perintahkan kepadanya","No! Man has not yet accomplished what He commanded him"],["فَلْيَنظُرِ ٱلْإِنسَـٰنُ إِلَىٰ طَعَامِهِۦٓ","Maka hendaklah manusia itu memperhatikan makanannya","Then let mankind look at his food"],["أَنَّا صَبَبْنَا ٱلْمَآءَ صَبًّا","Kamilah yang telah mencurahkan air melimpah (dari langit)","How We poured down water in torrents"],["ثُمَّ شَقَقْنَا ٱلْأَرْضَ شَقًّا","kemudian Kami belah bumi dengan sebaik-baiknya","Then We broke open the earth, splitting [it with sprouts]"],["فَأَنۢبَتْنَا فِيهَا حَبًّا","lalu di sana Kami tumbuhkan biji-bijian","And caused to grow within it grain"],["وَعِنَبًا وَقَضْبًا","dan anggur dan sayur-sayuran","And grapes and herbage"],["وَزَيْتُونًا وَنَخْلًا","dan zaitun dan pohon kurma","And olive and palm trees"],["وَحَدَآئِقَ غُلْبًا","dan kebun-kebun (yang) rindang","And gardens of dense shrubbery"],["وَفَـٰكِهَةً وَأَبًّا","dan buah-buahan serta rerumputan","And fruit and grass"],["مَّتَـٰعًا لَّكُمْ وَلِأَنْعَـٰمِكُمْ","(Semua itu) untuk kesenanganmu dan untuk hewan-hewan ternakmu","[As] enjoyment for you and your grazing livestock"],["فَإِذَا جَآءَتِ ٱلصَّآخَّةُ","Maka apabila datang suara yang memekakkan (tiupan sangkakala yang kedua)","But when there comes the Deafening Blast"],["يَوْمَ يَفِرُّ ٱلْمَرْءُ مِنْ أَخِيهِ","pada hari itu manusia lari dari saudaranya","On the Day a man will flee from his brother"],["وَأُمِّهِۦ وَأَبِيهِ","dan dari ibu dan bapaknya","And his mother and his father"],["وَصَـٰحِبَتِهِۦ وَبَنِيهِ","dan dari istri dan anak-anaknya","And his wife and his children"],["لِكُلِّ ٱمْرِيٍٕ مِّنْهُمْ يَوْمَئِذٍ شَأْنٌ يُغْنِيهِ","Setiap orang dari mereka pada hari itu mempunyai urusan yang menyibukkannya","For every man, that Day, will be a matter adequate for him"],["وُجُوهٌ يَوْمَئِذٍ مُّسْفِرَةٌ","Pada hari itu ada wajah-wajah yang berseri-seri","[Some] faces, that Day, will be bright"],["ضَاحِكَةٌ مُّسْتَبْشِرَةٌ","tertawa dan gembira ria","Laughing, rejoicing at good news"],["وَوُجُوهٌ يَوْمَئِذٍ عَلَيْهَا غَبَرَةٌ","dan pada hari itu ada (pula) wajah-wajah yang tertutup debu (suram)","And [other] faces, that Day, will have upon them dust"],["تَرْهَقُهَا قَتَرَةٌ","tertutup oleh kegelapan (ditimpa kehinaan dan kesusahan)","Blackness will cover them"],["أُوْلَـٰٓئِكَ هُمُ ٱلْكَفَرَةُ ٱلْفَجَرَةُ","Mereka itulah orang-orang kafir yang durhaka","Those are the disbelievers, the wicked ones"]]},{"n":"At-Takwir","a":[["إِذَا ٱلشَّمْسُ كُوِّرَتْ","Apabila matahari digulung","When the sun is wrapped up [in darkness]"],["وَإِذَا ٱلنُّجُومُ ٱنكَدَرَتْ","dan apabila bintang-bintang berjatuhan","And when the stars fall, dispersing"],["وَإِذَا ٱلْجِبَالُ سُيِّرَتْ","dan apabila gunung-gunung dihancurkan","And when the mountains are removed"],["وَإِذَا ٱلْعِشَارُ عُطِّلَتْ","dan apabila unta-unta yang bunting ditinggalkan (tidak terurus)","And when full-term she-camels are neglected"],["وَإِذَا ٱلْوُحُوشُ حُشِرَتْ","dan apabila binatang-binatang liar dikumpulkan","And when the wild beasts are gathered"],["وَإِذَا ٱلْبِحَارُ سُجِّرَتْ","dan apabila lautan dipanaskan","And when the seas are filled with flame"],["وَإِذَا ٱلنُّفُوسُ زُوِّجَتْ","dan apabila roh-roh dipertemukan (dengan tubuh)","And when the souls are paired"],["وَإِذَا ٱلْمَوْءُۥدَةُ سُئِلَتْ","dan apabila bayi-bayi perempuan yang dikubur hidup-hidup ditanya","And when the girl [who was] buried alive is asked"],["بِأَيِّ ذَنۢبٍ قُتِلَتْ","karena dosa apa dia dibunuh","For what sin she was killed"],["وَإِذَا ٱلصُّحُفُ نُشِرَتْ","Dan apabila lembaran-lembaran (catatan amal) telah dibuka lebar-lebar","And when the pages are made public"],["وَإِذَا ٱلسَّمَآءُ كُشِطَتْ","dan apabila langit dilenyapkan","And when the sky is stripped away"],["وَإِذَا ٱلْجَحِيمُ سُعِّرَتْ","dan apabila neraka Jahim dinyalakan","And when Hellfire is set ablaze"],["وَإِذَا ٱلْجَنَّةُ أُزْلِفَتْ","dan apabila surga didekatkan","And when Paradise is brought near"],["عَلِمَتْ نَفْسٌ مَّآ أَحْضَرَتْ","setiap jiwa akan mengetahui apa yang telah dikerjakannya","A soul will [then] know what it has brought [with it]"],["فَلَآ أُقْسِمُ بِٱلْخُنَّسِ","Aku bersumpah demi bintang-bintang","So I swear by the retreating stars"],["ٱلْجَوَارِ ٱلْكُنَّسِ","yang beredar dan terbenam","Those that run [their courses] and disappear"],["وَٱلَّيْلِ إِذَا عَسْعَسَ","demi malam apabila telah larut","And by the night as it closes in"],["وَٱلصُّبْحِ إِذَا تَنَفَّسَ","dan demi subuh apabila telah menyinsing","And by the dawn when it breathes"],["إِنَّهُۥ لَقَوْلُ رَسُولٍ كَرِيمٍ","sesungguhnya (Alquran) itu benar-benar firman (Allah yang dibawa oleh) utusan yang mulia (Jibril)","[That] indeed, the Qur'an is a word [conveyed by] a noble messenger"],["ذِي قُوَّةٍ عِندَ ذِي ٱلْعَرْشِ مَكِينٍ","yang memiliki kekuatan, memiliki kedudukan tinggi di sisi (Allah) yang memiliki Arasy","[Who is] possessed of power and with the Owner of the Throne, secure [in position]"],["مُّطَاعٍ ثَمَّ أَمِينٍ","yang di sana (di alam malaikat) ditaati dan dipercaya","Obeyed there [in the heavens] and trustworthy"],["وَمَا صَاحِبُكُم بِمَجْنُونٍ","Dan temanmu (Muhammad) itu bukanlah orang gila","And your companion is not [at all] mad"],["وَلَقَدْ رَءَاهُ بِٱلْأُفُقِ ٱلْمُبِينِ","Dan sungguh, dia (Muhammad) telah melihatnya (Jibril) di ufuk yang terang","And he has already seen Gabriel in the clear horizon"],["وَمَا هُوَ عَلَى ٱلْغَيْبِ بِضَنِينٍ","Dan Dia (Muhammad) bukanlah seorang yang kikir (enggan) untuk menerangkan yang gaib","And Muhammad is not a withholder of [knowledge of] the unseen"],["وَمَا هُوَ بِقَوْلِ شَيْطَـٰنٍ رَّجِيمٍ","Dan (Alquran) itu bukanlah perkataan setan yang terkutuk","And the Qur'an is not the word of a devil, expelled [from the heavens]"],["فَأَيْنَ تَذْهَبُونَ","maka ke manakah kamu akan pergi","So where are you going"],["إِنْ هُوَ إِلَّا ذِكْرٌ لِّلْعَـٰلَمِينَ","(Alquran) itu tidak lain adalah peringatan bagi seluruh alam","It is not except a reminder to the worlds"],["لِمَن شَآءَ مِنكُمْ أَن يَسْتَقِيمَ","(yaitu) bagi siapa di antara kamu yang menghendaki menempuh jalan yang lurus","For whoever wills among you to take a right course"],["وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُ رَبُّ ٱلْعَـٰلَمِينَ","Dan kamu tidak dapat menghendaki (menempuh jalan itu) kecuali apabila dikehendaki Allah, Tuhan seluruh alam","And you do not will except that Allah wills - Lord of the worlds"]]},{"n":"Al-Infitar","a":[["إِذَا ٱلسَّمَآءُ ٱنفَطَرَتْ","Apabila langit terbelah","When the sky breaks apart"],["وَإِذَا ٱلْكَوَاكِبُ ٱنتَثَرَتْ","dan apabila bintang-bintang jatuh berserakan","And when the stars fall, scattering"],["وَإِذَا ٱلْبِحَارُ فُجِّرَتْ","dan apabila lautan dijadikan meluap","And when the seas are erupted"],["وَإِذَا ٱلْقُبُورُ بُعْثِرَتْ","dan apabila kuburan-kuburan dibongkar","And when the [contents of] graves are scattered"],["عَلِمَتْ نَفْسٌ مَّا قَدَّمَتْ وَأَخَّرَتْ","(maka) setiap jiwa akan mengetahui apa yang telah dikerjakan dan yang dilalaikan(nya)","A soul will [then] know what it has put forth and kept back"],["يَـٰٓأَيُّهَا ٱلْإِنسَـٰنُ مَا غَرَّكَ بِرَبِّكَ ٱلْكَرِيمِ","Wahai manusia! Apakah yang telah memperdayakan kamu (berbuat durhaka) terhadap Tuhanmu Yang Maha Pengasih","O mankind, what has deceived you concerning your Lord, the Generous"],["ٱلَّذِي خَلَقَكَ فَسَوَّىٰكَ فَعَدَلَكَ","Yang telah menciptakanmu lalu menyempurnakan kejadianmu dan menjadikan (susunan tubuh)mu seimbang","Who created you, proportioned you, and balanced you"],["فِيٓ أَيِّ صُورَةٍ مَّا شَآءَ رَكَّبَكَ","dalam bentuk apa saja yang dikehendaki, Dia menyusun tubuhmu","In whatever form He willed has He assembled you"],["كَلَّا بَلْ تُكَذِّبُونَ بِٱلدِّينِ","Sekali-kali jangan begitu! Bahkan kamu mendustakan hari pembalasan","No! But you deny the Recompense"],["وَإِنَّ عَلَيْكُمْ لَحَـٰفِظِينَ","Dan sesungguhnya bagi kamu ada (malaikat-malaikat) yang mengawasi (pekerjaanmu)","And indeed, [appointed] over you are keepers"],["كِرَامًا كَـٰتِبِينَ","yang mulia (di sisi Allah) dan yang mencatat (perbuatanmu)","Noble and recording"],["يَعْلَمُونَ مَا تَفْعَلُونَ","mereka mengetahui apa yang kamu kerjakan","They know whatever you do"],["إِنَّ ٱلْأَبْرَارَ لَفِي نَعِيمٍ","Sesungguhnya orang-orang yang berbakti benar-benar berada dalam (surga yang penuh) kenikmatan","Indeed, the righteous will be in pleasure"],["وَإِنَّ ٱلْفُجَّارَ لَفِي جَحِيمٍ","dan sesungguhnya orang-orang yang durhaka benar-benar berada dalam neraka","And indeed, the wicked will be in Hellfire"],["يَصْلَوْنَهَا يَوْمَ ٱلدِّينِ","Mereka masuk ke dalamnya pada hari pembalasan","They will [enter to] burn therein on the Day of Recompense"],["وَمَا هُمْ عَنْهَا بِغَآئِبِينَ","Dan mereka tidak mungkin keluar dari neraka itu","And never therefrom will they be absent"],["وَمَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ","Dan tahukah kamu apakah hari pembalasan itu","And what can make you know what is the Day of Recompense"],["ثُمَّ مَآ أَدْرَىٰكَ مَا يَوْمُ ٱلدِّينِ","Sekali lagi, tahukah kamu apakah hari pembalasan itu","Then, what can make you know what is the Day of Recompense"],["يَوْمَ لَا تَمْلِكُ نَفْسٌ لِّنَفْسٍ شَيْـًٔاۖ وَٱلْأَمْرُ يَوْمَئِذٍ لِّلَّهِ","(Yaitu) pada hari (ketika) seseorang sama sekali tidak berdaya (menolong) orang lain. Dan segala urusan pada hari itu dalam kekuasaan Allah","It is the Day when a soul will not possess for another soul [power to do] a thing; and the command, that Day, is [entirely] with Allah"]]},{"n":"Al-Mutaffifin","a":[["وَيْلٌ لِّلْمُطَفِّفِينَ","Celakalah bagi orang-orang yang curang (dalam menakar dan menimbang)","Woe to those who give less [than due]"],["ٱلَّذِينَ إِذَا ٱكْتَالُواْ عَلَى ٱلنَّاسِ يَسْتَوْفُونَ","(yaitu) orang-orang yang apabila menerima takaran dari orang lain mereka minta dicukupkan","Who, when they take a measure from people, take in full"],["وَإِذَا كَالُوهُمْ أَو وَّزَنُوهُمْ يُخْسِرُونَ","dan apabila mereka menakar atau menimbang (untuk orang lain), mereka mengurangi","But if they give by measure or by weight to them, they cause loss"],["أَلَا يَظُنُّ أُوْلَـٰٓئِكَ أَنَّهُم مَّبْعُوثُونَ","Tidakkah mereka itu mengira, bahwa sesungguhnya mereka akan dibangkitkan","Do they not think that they will be resurrected"],["لِيَوْمٍ عَظِيمٍ","pada suatu hari yang besar","For a tremendous Day"],["يَوْمَ يَقُومُ ٱلنَّاسُ لِرَبِّ ٱلْعَـٰلَمِينَ","(yaitu) pada hari (ketika) semua orang bangkit menghadap Tuhan seluruh alam","The Day when mankind will stand before the Lord of the worlds"],["كَلَّآ إِنَّ كِتَـٰبَ ٱلْفُجَّارِ لَفِي سِجِّينٍ","Sekali-kali jangan begitu! Sesungguhnya catatan orang yang durhaka benar-benar tersimpan dalam Sijjīn","No! Indeed, the record of the wicked is in sijjeen"],["وَمَآ أَدْرَىٰكَ مَا سِجِّينٌ","Dan tahukah engkau apakah Sijjīn itu","And what can make you know what is sijjeen"],["كِتَـٰبٌ مَّرْقُومٌ","(Yaitu) Kitab yang berisi catatan (amal)","It is [their destination recorded in] a register inscribed"],["وَيْلٌ يَوْمَئِذٍ لِّلْمُكَذِّبِينَ","Celakalah pada hari itu, bagi orang-orang yang mendustakan","Woe, that Day, to the deniers"],["ٱلَّذِينَ يُكَذِّبُونَ بِيَوْمِ ٱلدِّينِ","(yaitu) orang-orang yang mendustakannya (hari pembalasan)","Who deny the Day of Recompense"],["وَمَا يُكَذِّبُ بِهِۦٓ إِلَّا كُلُّ مُعْتَدٍ أَثِيمٍ","Dan tidak ada yang mendustakannya (hari pembalasan) kecuali setiap orang yang melampaui batas dan berdosa","And none deny it except every sinful transgressor"],["إِذَا تُتْلَىٰ عَلَيْهِ ءَايَـٰتُنَا قَالَ أَسَـٰطِيرُ ٱلْأَوَّلِينَ","yang apabila dibacakan kepadanya ayat-ayat Kami, dia berkata, \"Itu adalah dongeng orang-orang dahulu","When Our verses are recited to him, he says, \"Legends of the former peoples"],["كَلَّاۖ بَلْۜ رَانَ عَلَىٰ قُلُوبِهِم مَّا كَانُواْ يَكْسِبُونَ","Sekali-kali tidak! Bahkan apa yang mereka kerjakan itu telah menutupi hati mereka","No! Rather, the stain has covered their hearts of that which they were earning"],["كَلَّآ إِنَّهُمْ عَن رَّبِّهِمْ يَوْمَئِذٍ لَّمَحْجُوبُونَ","(Sekali-kali tidak!901) Sesungguhnya mereka pada hari itu benar-benar terhalang dari (melihat) Tuhannya","No! Indeed, from their Lord, that Day, they will be partitioned"],["ثُمَّ إِنَّهُمْ لَصَالُواْ ٱلْجَحِيمِ","Kemudian, sesungguhnya mereka benar-benar masuk neraka","Then indeed, they will [enter and] burn in Hellfire"],["ثُمَّ يُقَالُ هَـٰذَا ٱلَّذِي كُنتُم بِهِۦ تُكَذِّبُونَ","Kemudian, dikatakan (kepada mereka), \"Inilah (azab) yang dahulu kamu dustakan","Then it will be said [to them], \"This is what you used to deny"],["كَلَّآ إِنَّ كِتَـٰبَ ٱلْأَبْرَارِ لَفِي عِلِّيِّينَ","Sekali-kali tidak! Sesungguhnya catatan orang-orang yang berbakti benar-benar tersimpan dalam 'Illiyyīn","No! Indeed, the record of the righteous is in 'illiyyun"],["وَمَآ أَدْرَىٰكَ مَا عِلِّيُّونَ","Dan tahukah engkau apakah 'Illiyyīn itu","And what can make you know what is 'illiyyun"],["كِتَـٰبٌ مَّرْقُومٌ","(Yaitu) Kitab yang berisi catatan (amal)","It is [their destination recorded in] a register inscribed"],["يَشْهَدُهُ ٱلْمُقَرَّبُونَ","yang disaksikan oleh (malaikat-malaikat) yang didekatkan (kepada Allah)","Which is witnessed by those brought near [to Allah]"],["إِنَّ ٱلْأَبْرَارَ لَفِي نَعِيمٍ","Sesungguhnya orang-orang yang berbakti benar-benar berada dalam (surga yang penuh) kenikmatan","Indeed, the righteous will be in pleasure"],["عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ","mereka (duduk) di atas dipan-dipan melepas pandangan","On adorned couches, observing"],["تَعْرِفُ فِي وُجُوهِهِمْ نَضْرَةَ ٱلنَّعِيمِ","Kamu dapat mengetahui dari wajah mereka kesenangan hidup yang penuh kenikmatan","You will recognize in their faces the radiance of pleasure"],["يُسْقَوْنَ مِن رَّحِيقٍ مَّخْتُومٍ","Mereka diberi minum dari khamar murni (tidak memabukkan) yang (tempatnya) masih dilak (disegel)","They will be given to drink [pure] wine [which was] sealed"],["خِتَـٰمُهُۥ مِسْكٌۚ وَفِي ذَـٰلِكَ فَلْيَتَنَافَسِ ٱلْمُتَنَـٰفِسُونَ","laknya dari kasturi. Dan untuk yang demikian itu hendaknya orang berlomba-lomba","The last of it is musk. So for this let the competitors compete"],["وَمِزَاجُهُۥ مِن تَسْنِيمٍ","Dan campurannya dari tasnīm","And its mixture is of Tasneem"],["عَيْنًا يَشْرَبُ بِهَا ٱلْمُقَرَّبُونَ","(yaitu) mata air yang diminum oleh mereka yang dekat (kepada Allah)","A spring from which those near [to Allah] drink"],["إِنَّ ٱلَّذِينَ أَجْرَمُواْ كَانُواْ مِنَ ٱلَّذِينَ ءَامَنُواْ يَضْحَكُونَ","Sesungguhnya orang-orang yang berdosa, adalah mereka yang dahulu menertawakan orang-orang yang beriman","Indeed, those who committed crimes used to laugh at those who believed"],["وَإِذَا مَرُّواْ بِهِمْ يَتَغَامَزُونَ","Dan apabila mereka (orang-orang yang beriman) melintas di hadapan mereka, mereka saling mengedip-ngedipkan matanya","And when they passed by them, they would exchange derisive glances"],["وَإِذَا ٱنقَلَبُوٓاْ إِلَىٰٓ أَهْلِهِمُ ٱنقَلَبُواْ فَكِهِينَ","dan apabila kembali kepada kaumnya, mereka kembali dengan gembira ria","And when they returned to their people, they would return jesting"],["وَإِذَا رَأَوْهُمْ قَالُوٓاْ إِنَّ هَـٰٓؤُلَآءِ لَضَآلُّونَ","Dan apabila mereka melihat (orang-orang mukmin), mereka mengatakan, \"Sesungguhnya mereka benar-benar orang-orang sesat","And when they saw them, they would say, \"Indeed, those are truly lost"],["وَمَآ أُرْسِلُواْ عَلَيْهِمْ حَـٰفِظِينَ","padahal (orang-orang yang berdosa itu), mereka tidak diutus sebagai penjaga (orang-orang mukmin)","But they had not been sent as guardians over them"],["فَٱلْيَوْمَ ٱلَّذِينَ ءَامَنُواْ مِنَ ٱلْكُفَّارِ يَضْحَكُونَ","Maka pada hari ini, orang-orang yang beriman yang menertawakan orang-orang kafir","So Today those who believed are laughing at the disbelievers"],["عَلَى ٱلْأَرَآئِكِ يَنظُرُونَ","mereka (duduk) di atas dipan-dipan melepas pandangan","On adorned couches, observing"],["هَلْ ثُوِّبَ ٱلْكُفَّارُ مَا كَانُواْ يَفْعَلُونَ","Apakah orang-orang kafir itu diberi balasan (hukuman) terhadap apa yang telah mereka perbuat","Have the disbelievers [not] been rewarded [this Day] for what they used to do"]]},{"n":"Al-Inshiqaq","a":[["إِذَا ٱلسَّمَآءُ ٱنشَقَّتْ","Apabila langit terbelah","When the sky has split [open]"],["وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","dan patuh kepada Tuhannya, dan sudah semestinya patuh","And has responded to its Lord and was obligated [to do so]"],["وَإِذَا ٱلْأَرْضُ مُدَّتْ","dan apabila bumi diratakan","And when the earth has been extended"],["وَأَلْقَتْ مَا فِيهَا وَتَخَلَّتْ","dan memuntahkan apa yang ada di dalamnya dan menjadi kosong","And has cast out that within it and relinquished [it]"],["وَأَذِنَتْ لِرَبِّهَا وَحُقَّتْ","dan patuh kepada Tuhannya, dan sudah semestinya patuh","And has responded to its Lord and was obligated [to do so]"],["يَـٰٓأَيُّهَا ٱلْإِنسَـٰنُ إِنَّكَ كَادِحٌ إِلَىٰ رَبِّكَ كَدْحًا فَمُلَـٰقِيهِ","Wahai manusia! Sesungguhnya kamu telah bekerja keras menuju Tuhanmu, maka kamu akan menemui-Nya","O mankind, indeed you are laboring toward your Lord with [great] exertion and will meet it"],["فَأَمَّا مَنْ أُوتِيَ كِتَـٰبَهُۥ بِيَمِينِهِۦ","Maka adapun orang yang catatanya diberikan dari sebelah kanannya","Then as for he who is given his record in his right hand"],["فَسَوْفَ يُحَاسَبُ حِسَابًا يَسِيرًا","maka dia akan diperiksa dengan pemeriksaan yang mudah","He will be judged with an easy account"],["وَيَنقَلِبُ إِلَىٰٓ أَهْلِهِۦ مَسْرُورًا","dan dia akan kembali kepada keluarganya (yang sama-sama beriman) dengan gembira","And return to his people in happiness"],["وَأَمَّا مَنْ أُوتِيَ كِتَـٰبَهُۥ وَرَآءَ ظَهْرِهِۦ","Dan adapun orang yang catatannya diberikan dari arah belakang","But as for he who is given his record behind his back"],["فَسَوْفَ يَدْعُواْ ثُبُورًا","maka dia akan berteriak, \"Celakalah aku","He will cry out for destruction"],["وَيَصْلَىٰ سَعِيرًا","Dan dia akan masuk ke dalam api yang menyala-nyala (neraka)","And [enter to] burn in a Blaze"],["إِنَّهُۥ كَانَ فِيٓ أَهْلِهِۦ مَسْرُورًا","Sungguh, dia dahulu (di dunia) bergembira di kalangan keluarganya (yang sama-sama kafir)","Indeed, he had [once] been among his people in happiness"],["إِنَّهُۥ ظَنَّ أَن لَّن يَحُورَ","Sesungguhnya dia mengira bahwa dia tidak akan kembali (kepada Tuhannya)","Indeed, he had thought he would never return [to Allah]"],["بَلَىٰٓۚ إِنَّ رَبَّهُۥ كَانَ بِهِۦ بَصِيرًا","Tidak demikian, sesungguhnya Tuhannya selalu melihatnya","But yes! Indeed, his Lord was ever of him, Seeing"],["فَلَآ أُقْسِمُ بِٱلشَّفَقِ","Maka Aku bersumpah demi cahaya merah pada waktu senja","So I swear by the twilight glow"],["وَٱلَّيْلِ وَمَا وَسَقَ","demi malam dan apa yang diselubunginya","And [by] the night and what it envelops"],["وَٱلْقَمَرِ إِذَا ٱتَّسَقَ","demi bulan apabila jadi purnama","And [by] the moon when it becomes full"],["لَتَرْكَبُنَّ طَبَقًا عَن طَبَقٍ","sungguh, akan kamu jalani tingkat demi tingkat (dalam kehidupan)","[That] you will surely experience state after state"],["فَمَا لَهُمْ لَا يُؤْمِنُونَ","Maka mengapa mereka tidak mau beriman","So what is [the matter] with them [that] they do not believe"],["وَإِذَا قُرِئَ عَلَيْهِمُ ٱلْقُرْءَانُ لَا يَسْجُدُونَۤ۩","Dan apabila Alquran dibacakan kepada mereka, mereka tidak (mau) bersujud","And when the Qur'an is recited to them, they do not prostrate [to Allah]"],["بَلِ ٱلَّذِينَ كَفَرُواْ يُكَذِّبُونَ","bahkan orang-orang kafir itu mendustakan-(nya)","But those who have disbelieved deny"],["وَٱللَّهُ أَعْلَمُ بِمَا يُوعُونَ","Dan Allah lebih mengetahui apa yang mereka sembunyikan (dalam hati mereka)","And Allah is most knowing of what they keep within themselves"],["فَبَشِّرْهُم بِعَذَابٍ أَلِيمٍ","Maka sampaikanlah kepada mereka (ancaman) azab yang pedih","So give them tidings of a painful punishment"],["إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَـٰتِ لَهُمْ أَجْرٌ غَيْرُ مَمْنُونِۭ","kecuali orang-orang yang beriman dan mengerjakan kebajikan, mereka akan mendapat pahala yang tidak putus-putusnya","Except for those who believe and do righteous deeds. For them is a reward uninterrupted"]]},{"n":"Al-Buruj","a":[["وَٱلسَّمَآءِ ذَاتِ ٱلْبُرُوجِ","Demi langit yang mempunyai gugusan bintang","By the sky containing great stars"],["وَٱلْيَوْمِ ٱلْمَوْعُودِ","dan demi hari yang dijanjikan","And [by] the promised Day"],["وَشَاهِدٍ وَمَشْهُودٍ","Demi yang menyaksikan dan yang disaksikan","And [by] the witness and what is witnessed"],["قُتِلَ أَصْحَـٰبُ ٱلْأُخْدُودِ","Binasalah orang-orang yang membuat parit (yaitu para pembesar Najran di Yaman)","Cursed were the companions of the trench"],["ٱلنَّارِ ذَاتِ ٱلْوَقُودِ","yang berapi (yang mempunyai) kayu bakar","[Containing] the fire full of fuel"],["إِذْ هُمْ عَلَيْهَا قُعُودٌ","ketika mereka duduk di sekitarnya","When they were sitting near it"],["وَهُمْ عَلَىٰ مَا يَفْعَلُونَ بِٱلْمُؤْمِنِينَ شُهُودٌ","sedang mereka menyaksikan apa yang mereka perbuat terhadap orang-orang mukmin","And they, to what they were doing against the believers, were witnesses"],["وَمَا نَقَمُواْ مِنْهُمْ إِلَّآ أَن يُؤْمِنُواْ بِٱللَّهِ ٱلْعَزِيزِ ٱلْحَمِيدِ","Dan mereka menyiksa orang-orang mukmin itu hanya karena (orang-orang mukmin itu) beriman kepada Allah Yang Mahaperkasa, Maha Terpuji","And they resented them not except because they believed in Allah, the Exalted in Might, the Praiseworthy"],["ٱلَّذِي لَهُۥ مُلْكُ ٱلسَّمَـٰوَـٰتِ وَٱلْأَرْضِۚ وَٱللَّهُ عَلَىٰ كُلِّ شَيْءٍ شَهِيدٌ","yang memiliki kerajaan langit dan bumi. Dan Allah Maha Menyaksikan segala sesuatu","To whom belongs the dominion of the heavens and the earth. And Allah, over all things, is Witness"],["إِنَّ ٱلَّذِينَ فَتَنُواْ ٱلْمُؤْمِنِينَ وَٱلْمُؤْمِنَـٰتِ ثُمَّ لَمْ يَتُوبُواْ فَلَهُمْ عَذَابُ جَهَنَّمَ وَلَهُمْ عَذَابُ ٱلْحَرِيقِ","Sungguh, orang-orang yang mendatangkan cobaan (bencana, membunuh, menyiksa) kepada orang-orang mukmin laki-laki dan perempuan lalu mereka tidak bertobat, maka mereka akan mendapat azab Jahanam dan mereka akan mendapat azab (neraka) yang membakar","Indeed, those who have tortured the believing men and believing women and then have not repented will have the punishment of Hell, and they will have the punishment of the Burning Fire"],["إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَـٰتِ لَهُمْ جَنَّـٰتٌ تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَـٰرُۚ ذَـٰلِكَ ٱلْفَوْزُ ٱلْكَبِيرُ","Sungguh, orang-orang yang beriman dan mengerjakan kebajikan, mereka akan mendapat surga yang mengalir di bawahnya sungai-sungai, itulah kemenangan yang agung","Indeed, those who have believed and done righteous deeds will have gardens beneath which rivers flow. That is the great attainment"],["إِنَّ بَطْشَ رَبِّكَ لَشَدِيدٌ","Sungguh, azab Tuhanmu sangat keras","Indeed, the vengeance of your Lord is severe"],["إِنَّهُۥ هُوَ يُبْدِئُ وَيُعِيدُ","Sungguh, Dialah yang memulai penciptaan (makhluk) dan yang menghidupkannya (kembali)","Indeed, it is He who originates [creation] and repeats"],["وَهُوَ ٱلْغَفُورُ ٱلْوَدُودُ","Dan Dialah Yang Maha Pengampun, Maha Pengasih","And He is the Forgiving, the Affectionate"],["ذُو ٱلْعَرْشِ ٱلْمَجِيدُ","Yang memiliki Arasy, lagi Mahamulia","Honorable Owner of the Throne"],["فَعَّالٌ لِّمَا يُرِيدُ","Mahakuasa berbuat apa yang Dia kehendaki","Effecter of what He intends"],["هَلْ أَتَىٰكَ حَدِيثُ ٱلْجُنُودِ","Sudahkah sampai kepadamu berita tentang bala tentara (penentang)","Has there reached you the story of the soldiers"],["فِرْعَوْنَ وَثَمُودَ","(yaitu) Fir'aun dan Samud","[Those of] Pharaoh and Thamud"],["بَلِ ٱلَّذِينَ كَفَرُواْ فِي تَكْذِيبٍ","Memang orang-orang kafir (selalu) mendustakan","But they who disbelieve are in [persistent] denial"],["وَٱللَّهُ مِن وَرَآئِهِم مُّحِيطُۢ","padahal Allah mengepung dari belakang mereka (sehingga tidak dapat lolos)","While Allah encompasses them from behind"],["بَلْ هُوَ قُرْءَانٌ مَّجِيدٌ","Bahkan (yang didustakan itu) ialah Alquran yang mulia","But this is an honored Qur'an"],["فِي لَوْحٍ مَّحْفُوظِۭ","yang (tersimpan) dalam (tempat) yang terjaga (Lauḥ Maḥfūẓ)","[Inscribed] in a Preserved Slate"]]},{"n":"At-Tariq","a":[["وَٱلسَّمَآءِ وَٱلطَّارِقِ","Demi langit dan yang datang pada malam hari","By the sky and the night comer"],["وَمَآ أَدْرَىٰكَ مَا ٱلطَّارِقُ","Dan tahukah kamu apakah yang datang pada malam hari itu","And what can make you know what is the night comer"],["ٱلنَّجْمُ ٱلثَّاقِبُ","(Yaitu) bintang yang bersinar tajam","It is the piercing star"],["إِن كُلُّ نَفْسٍ لَّمَّا عَلَيْهَا حَافِظٌ","setiap orang pasti ada penjaganya","There is no soul but that it has over it a protector"],["فَلْيَنظُرِ ٱلْإِنسَـٰنُ مِمَّ خُلِقَ","Maka hendaklah manusia memperhatikan dari apa dia diciptakan","So let man observe from what he was created"],["خُلِقَ مِن مَّآءٍ دَافِقٍ","Dia diciptakan dari air (mani) yang terpancar","He was created from a fluid, ejected"],["يَخْرُجُ مِنۢ بَيْنِ ٱلصُّلْبِ وَٱلتَّرَآئِبِ","yang keluar dari antara tulang punggung (sulbi) dan tulang dada","Emerging from between the backbone and the ribs"],["إِنَّهُۥ عَلَىٰ رَجْعِهِۦ لَقَادِرٌ","Sungguh, Allah benar-benar kuasa untuk mengembalikannya (hidup setelah mati)","Indeed, Allah, to return him [to life], is Able"],["يَوْمَ تُبْلَى ٱلسَّرَآئِرُ","Pada hari ditampakkan segala rahasia","The Day when secrets will be put on trial"],["فَمَا لَهُۥ مِن قُوَّةٍ وَلَا نَاصِرٍ","maka manusia tidak lagi mempunyai suatu kekuatan dan tidak (pula) ada penolong","Then man will have no power or any helper"],["وَٱلسَّمَآءِ ذَاتِ ٱلرَّجْعِ","Demi langit yang mengandung hujan","By the sky which returns [rain]"],["وَٱلْأَرْضِ ذَاتِ ٱلصَّدْعِ","dan bumi yang mempunyai tumbuh-tumbuhan","And [by] the earth which cracks open"],["إِنَّهُۥ لَقَوْلٌ فَصْلٌ","sungguh, (Alquran) itu benar-benar firman pemisah (antara yang hak dan yang batil)","Indeed, the Qur'an is a decisive statement"],["وَمَا هُوَ بِٱلْهَزْلِ","dan (Alquran) itu bukanlah senda gurauan","And it is not amusement"],["إِنَّهُمْ يَكِيدُونَ كَيْدًا","Sungguh, mereka (orang kafir) merencanakan tipu daya yang jahat","Indeed, they are planning a plan"],["وَأَكِيدُ كَيْدًا","dan Aku pun membuat rencana (tipu daya) yang jitu","But I am planning a plan"],["فَمَهِّلِ ٱلْكَـٰفِرِينَ أَمْهِلْهُمْ رُوَيْدَۢا","Karena itu berilah penangguhan kepada orang-orang kafir. Berilah mereka kesempatan untuk sementara waktu","So allow time for the disbelievers. Leave them awhile"]]},{"n":"Al-A'la","a":[["سَبِّحِ ٱسْمَ رَبِّكَ ٱلْأَعْلَى","Sucikanlah nama Tuhanmu Yang Mahatinggi","Exalt the name of your Lord, the Most High"],["ٱلَّذِي خَلَقَ فَسَوَّىٰ","yang menciptakan, lalu menyempurnakan (penciptaan-Nya)","Who created and proportioned"],["وَٱلَّذِي قَدَّرَ فَهَدَىٰ","yang menentukan kadar (masing-masing) dan memberi petunjuk","And who destined and [then] guided"],["وَٱلَّذِيٓ أَخْرَجَ ٱلْمَرْعَىٰ","dan Yang menumbuhkan rerumputan","And who brings out the pasture"],["فَجَعَلَهُۥ غُثَآءً أَحْوَىٰ","lalu dijadikan-Nya (rumput-rumput) itu kering kehitam-hitaman","And [then] makes it black stubble"],["سَنُقْرِئُكَ فَلَا تَنسَىٰٓ","Kami akan membacakan (Alquran) kepadamu (Muhammad) sehingga engkau tidak akan lupa","We will make you recite, [O Muhammad], and you will not forget"],["إِلَّا مَا شَآءَ ٱللَّهُۚ إِنَّهُۥ يَعْلَمُ ٱلْجَهْرَ وَمَا يَخْفَىٰ","kecuali jika Allah menghendaki. Sungguh, Dia mengetahui yang terang dan yang tersembunyi","Except what Allah should will. Indeed, He knows what is declared and what is hidden"],["وَنُيَسِّرُكَ لِلْيُسْرَىٰ","Dan Kami akan memudahkan bagimu ke jalan kemudahan (mencapai kebahagian dunia dan akhirat)","And We will ease you toward ease"],["فَذَكِّرْ إِن نَّفَعَتِ ٱلذِّكْرَىٰ","oleh sebab itu berikanlah peringatan, karena peringatan itu bermanfaat","So remind, if the reminder should benefit"],["سَيَذَّكَّرُ مَن يَخْشَىٰ","orang yang takut (kepada Allah) akan mendapat pelajaran","He who fears [Allah] will be reminded"],["وَيَتَجَنَّبُهَا ٱلْأَشْقَى","dan orang yang celaka (kafir) akan menjauhinya","But the wretched one will avoid it"],["ٱلَّذِي يَصْلَى ٱلنَّارَ ٱلْكُبْرَىٰ","(yaitu) orang yang akan memasuki api yang besar (neraka)","[He] who will [enter and] burn in the greatest Fire"],["ثُمَّ لَا يَمُوتُ فِيهَا وَلَا يَحْيَىٰ","selanjutnya dia di sana tidak mati dan tidak (pula) hidup","Neither dying therein nor living"],["قَدْ أَفْلَحَ مَن تَزَكَّىٰ","Sungguh beruntung orang yang menyucikan diri (dengan beriman)","He has certainly succeeded who purifies himself"],["وَذَكَرَ ٱسْمَ رَبِّهِۦ فَصَلَّىٰ","dan mengingat nama Tuhannya, lalu dia salat","And mentions the name of his Lord and prays"],["بَلْ تُؤْثِرُونَ ٱلْحَيَوٰةَ ٱلدُّنْيَا","Sedangkan kamu (orang-orang kafir) memilih kehidupan dunia","But you prefer the worldly life"],["وَٱلْأٓخِرَةُ خَيْرٌ وَأَبْقَىٰٓ","padahal kehidupan akhirat itu lebih baik dan lebih kekal","While the Hereafter is better and more enduring"],["إِنَّ هَـٰذَا لَفِي ٱلصُّحُفِ ٱلْأُولَىٰ","Sesungguhnya ini terdapat dalam kitab-kitab yang dahulu","Indeed, this is in the former scriptures"],["صُحُفِ إِبْرَـٰهِيمَ وَمُوسَىٰ","(yaitu) kitab-kitab Ibrahim dan Musa","The scriptures of Abraham and Moses"]]},{"n":"Al-Ghashiyah","a":[["هَلْ أَتَىٰكَ حَدِيثُ ٱلْغَـٰشِيَةِ","Sudahkah sampai kepadamu berita tentang (hari Kiamat)","Has there reached you the report of the Overwhelming [event]"],["وُجُوهٌ يَوْمَئِذٍ خَـٰشِعَةٌ","Pada hari itu banyak wajah yang tertunduk hina","[Some] faces, that Day, will be humbled"],["عَامِلَةٌ نَّاصِبَةٌ","(karena) bekerja keras lagi kepayahan","Working [hard] and exhausted"],["تَصْلَىٰ نَارًا حَامِيَةً","mereka memasuki api yang sangat panas (neraka)","They will [enter to] burn in an intensely hot Fire"],["تُسْقَىٰ مِنْ عَيْنٍ ءَانِيَةٍ","diberi minum dari sumber mata air yang sangat panas","They will be given drink from a boiling spring"],["لَّيْسَ لَهُمْ طَعَامٌ إِلَّا مِن ضَرِيعٍ","Tidak ada makanan bagi mereka selain dari pohon yang berduri","For them there will be no food except from a poisonous, thorny plant"],["لَّا يُسْمِنُ وَلَا يُغْنِي مِن جُوعٍ","yang tidak menggemukkan dan tidak menghilangkan lapar","Which neither nourishes nor avails against hunger"],["وُجُوهٌ يَوْمَئِذٍ نَّاعِمَةٌ","Pada hari itu banyak (pula) wajah yang berseri-seri","[Other] faces, that Day, will show pleasure"],["لِّسَعْيِهَا رَاضِيَةٌ","merasa senang karena usahanya (sendiri)","With their effort [they are] satisfied"],["فِي جَنَّةٍ عَالِيَةٍ","(mereka) dalam surga yang tinggi","In an elevated garden"],["لَّا تَسْمَعُ فِيهَا لَـٰغِيَةً","di sana (kamu) tidak mendengar perkataan yang tidak berguna","Wherein they will hear no unsuitable speech"],["فِيهَا عَيْنٌ جَارِيَةٌ","Di sana ada mata air yang mengalir","Within it is a flowing spring"],["فِيهَا سُرُرٌ مَّرْفُوعَةٌ","Di sana ada dipan-dipan yang ditinggikan","Within it are couches raised high"],["وَأَكْوَابٌ مَّوْضُوعَةٌ","dan gelas-gelas yang tersedia (di dekatnya)","And cups put in place"],["وَنَمَارِقُ مَصْفُوفَةٌ","dan bantal-bantal sandaran yang tersusun","And cushions lined up"],["وَزَرَابِيُّ مَبْثُوثَةٌ","dan permadani-permadani yang terhampar","And carpets spread around"],["أَفَلَا يَنظُرُونَ إِلَى ٱلْإِبِلِ كَيْفَ خُلِقَتْ","Maka tidakkah mereka memperhatikan unta, bagaimana diciptakan","Then do they not look at the camels - how they are created"],["وَإِلَى ٱلسَّمَآءِ كَيْفَ رُفِعَتْ","Dan langit, bagaimana ditinggikan","And at the sky - how it is raised"],["وَإِلَى ٱلْجِبَالِ كَيْفَ نُصِبَتْ","Dan gunung-gunung bagaimana ditegakkan","And at the mountains - how they are erected"],["وَإِلَى ٱلْأَرْضِ كَيْفَ سُطِحَتْ","Dan bumi bagaimana dihamparkan","And at the earth - how it is spread out"],["فَذَكِّرْ إِنَّمَآ أَنتَ مُذَكِّرٌ","Maka berilah peringatan, karena sesungguhnya engkau (Muhammad) hanyalah pemberi peringatan","So remind, [O Muhammad]; you are only a reminder"],["لَّسْتَ عَلَيْهِم بِمُصَيْطِرٍ","Engkau bukanlah orang yang berkuasa atas mereka","You are not over them a controller"],["إِلَّا مَن تَوَلَّىٰ وَكَفَرَ","kecuali (jika ada) orang yang berpaling dan kafir","However, he who turns away and disbelieves"],["فَيُعَذِّبُهُ ٱللَّهُ ٱلْعَذَابَ ٱلْأَكْبَرَ","maka Allah akan mengazabnya dengan azab yang besar","Then Allah will punish him with the greatest punishment"],["إِنَّ إِلَيْنَآ إِيَابَهُمْ","Sungguh, kepada Kami lah mereka kembali","Indeed, to Us is their return"],["ثُمَّ إِنَّ عَلَيْنَا حِسَابَهُم","kemudian sesungguhnya (kewajiban) Kami lah membuat perhitungan atas mereka","Then indeed, upon Us is their account"]]},{"n":"Al-Fajr","a":[["وَٱلْفَجْرِ","Demi fajar","By the dawn"],["وَلَيَالٍ عَشْرٍ","demi malam yang sepuluh","And [by] ten nights"],["وَٱلشَّفْعِ وَٱلْوَتْرِ","demi yang genap dan yang ganjil","And [by] the even [number] and the odd"],["وَٱلَّيْلِ إِذَا يَسْرِ","demi malam apabila berlalu","And [by] the night when it passes"],["هَلْ فِي ذَـٰلِكَ قَسَمٌ لِّذِي حِجْرٍ","Adakah pada yang demikian itu terdapat sumpah (yang dapat diterima) bagi orang-orang yang berakal","Is there [not] in [all] that an oath [sufficient] for one of perception"],["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِعَادٍ","Tidakkah engkau (Muhammad) memperhatikan bagaimana Tuhanmu berbuat terhadap (kaum) 'Ād","Have you not considered how your Lord dealt with 'Aad"],["إِرَمَ ذَاتِ ٱلْعِمَادِ","(yaitu) penduduk Iram (ibukota kaum 'Ād) yang mempunyai bangunan-bangunan yang tinggi","[With] Iram - who had lofty pillars"],["ٱلَّتِي لَمْ يُخْلَقْ مِثْلُهَا فِي ٱلْبِلَـٰدِ","yang belum pernah dibangun (suatu kota) seperti itu, di negeri-negeri lain","The likes of whom had never been created in the land"],["وَثَمُودَ ٱلَّذِينَ جَابُواْ ٱلصَّخْرَ بِٱلْوَادِ","dan (terhadap) kaum Samud yang memotong batu-batu besar di lembah","And [with] Thamud, who carved out the rocks in the valley"],["وَفِرْعَوْنَ ذِي ٱلْأَوْتَادِ","dan (terhadap) Fir'aun yang mempunyai pasak-pasak (bangunan yang besar)","And [with] Pharaoh, owner of the stakes"],["ٱلَّذِينَ طَغَوْاْ فِي ٱلْبِلَـٰدِ","yang berbuat sewenang-wenang dalam negeri","[All of] whom oppressed within the lands"],["فَأَكْثَرُواْ فِيهَا ٱلْفَسَادَ","lalu mereka banyak berbuat kerusakan dalam negeri itu","And increased therein the corruption"],["فَصَبَّ عَلَيْهِمْ رَبُّكَ سَوْطَ عَذَابٍ","karena itu Tuhanmu menimpakan cemeti azab kepada mereka","So your Lord poured upon them a scourge of punishment"],["إِنَّ رَبَّكَ لَبِٱلْمِرْصَادِ","sungguh, Tuhanmu benar-benar mengawasi","Indeed, your Lord is in observation"],["فَأَمَّا ٱلْإِنسَـٰنُ إِذَا مَا ٱبْتَلَىٰهُ رَبُّهُۥ فَأَكْرَمَهُۥ وَنَعَّمَهُۥ فَيَقُولُ رَبِّيٓ أَكْرَمَنِ","Adapun manusia, apabila Tuhan mengujinya lalu memuliakannya dan memberinya kesenangan, maka dia berkata, \"Tuhanku telah memuliakanku","And as for man, when his Lord tries him and [thus] is generous to him and favors him, he says, \"My Lord has honored me"],["وَأَمَّآ إِذَا مَا ٱبْتَلَىٰهُ فَقَدَرَ عَلَيْهِ رِزْقَهُۥ فَيَقُولُ رَبِّيٓ أَهَـٰنَنِ","Namun apabila Tuhan mengujinya lalu membatasi rezekinya, maka dia berkata, \"Tuhanku telah menghinaku","But when He tries him and restricts his provision, he says, \"My Lord has humiliated me"],["كَلَّاۖ بَل لَّا تُكْرِمُونَ ٱلْيَتِيمَ","Sekali-kali tidak! Bahkan kamu tidak memuliakan anak yatim","No! But you do not honor the orphan"],["وَلَا تَحَـٰٓضُّونَ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","dan kamu tidak saling mengajak memberi makan orang miskin","And you do not encourage one another to feed the poor"],["وَتَأْكُلُونَ ٱلتُّرَاثَ أَكْلًا لَّمًّا","sedangkan kamu memakan harta warisan dengan cara mencampurbaurkan (yang halal dan yang haram)","And you consume inheritance, devouring [it] altogether"],["وَتُحِبُّونَ ٱلْمَالَ حُبًّا جَمًّا","dan kamu mencintai harta dengan kecintaan yang berlebihan","And you love wealth with immense love"],["كَلَّآۖ إِذَا دُكَّتِ ٱلْأَرْضُ دَكًّا دَكًّا","Sekali-kali tidak! Apabila bumi diguncangkan berturut-turut (berbenturan)","No! When the earth has been leveled - pounded and crushed"],["وَجَآءَ رَبُّكَ وَٱلْمَلَكُ صَفًّا صَفًّا","dan datanglah Tuhanmu; dan malaikat berbaris-baris","And your Lord has come and the angels, rank upon rank"],["وَجِاْيٓءَ يَوْمَئِذِۭ بِجَهَنَّمَۚ يَوْمَئِذٍ يَتَذَكَّرُ ٱلْإِنسَـٰنُ وَأَنَّىٰ لَهُ ٱلذِّكْرَىٰ","dan pada hari itu diperlihatkan neraka Jahanam; pada hari itu sadarlah manusia, tetapi tidak berguna lagi baginya kesadaran itu","And brought [within view], that Day, is Hell - that Day, man will remember, but what good to him will be the remembrance"],["يَقُولُ يَـٰلَيْتَنِي قَدَّمْتُ لِحَيَاتِي","Dia berkata, \"Alangkah baiknya sekiranya dahulu aku mengerjakan (kebajikan) untuk hidupku ini","He will say, \"Oh, I wish I had sent ahead [some good] for my life"],["فَيَوْمَئِذٍ لَّا يُعَذِّبُ عَذَابَهُۥٓ أَحَدٌ","Maka pada hari itu tidak ada seorang pun yang mengazab seperti azab-Nya (yang adil)","So on that Day, none will punish [as severely] as His punishment"],["وَلَا يُوثِقُ وَثَاقَهُۥٓ أَحَدٌ","dan tidak ada seorang pun yang mengikat seperti ikatan-Nya","And none will bind [as severely] as His binding [of the evildoers]"],["يَـٰٓأَيَّتُهَا ٱلنَّفْسُ ٱلْمُطْمَئِنَّةُ","Wahai jiwa yang tenang","[To the righteous it will be said], \"O reassured soul"],["ٱرْجِعِيٓ إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً","Kembalilah kepada Tuhanmu dengan hati yang rida dan diridai-Nya","Return to your Lord, well-pleased and pleasing [to Him]"],["فَٱدْخُلِي فِي عِبَـٰدِي","Maka masuklah ke dalam golongan hamba-hamba-Ku","And enter among My [righteous] servants"],["وَٱدْخُلِي جَنَّتِي","dan masuklah ke dalam surga-Ku","And enter My Paradise"]]},{"n":"Al-Balad","a":[["لَآ أُقْسِمُ بِهَـٰذَا ٱلْبَلَدِ","Aku bersumpah dengan negeri ini (Mekkah)","I swear by this city, Makkah"],["وَأَنتَ حِلُّۢ بِهَـٰذَا ٱلْبَلَدِ","dan engkau (Muhammad), bertempat di negeri (Mekkah) ini","And you, [O Muhammad], are free of restriction in this city"],["وَوَالِدٍ وَمَا وَلَدَ","dan demi (pertalian) bapak dan anaknya","And [by] the father and that which was born [of him]"],["لَقَدْ خَلَقْنَا ٱلْإِنسَـٰنَ فِي كَبَدٍ","Sungguh, Kami telah menciptakan manusia berada dalam susah payah","We have certainly created man into hardship"],["أَيَحْسَبُ أَن لَّن يَقْدِرَ عَلَيْهِ أَحَدٌ","Apakah dia (manusia) itu mengira bahwa tidak ada sesuatu pun yang berkuasa atasnya","Does he think that never will anyone overcome him"],["يَقُولُ أَهْلَكْتُ مَالًا لُّبَدًا","Dia mengatakan, \"Aku telah menghabiskan harta yang banyak","He says, \"I have spent wealth in abundance"],["أَيَحْسَبُ أَن لَّمْ يَرَهُۥٓ أَحَدٌ","Apakah dia mengira bahwa tidak ada sesuatu pun yang melihatnya","Does he think that no one has seen him"],["أَلَمْ نَجْعَل لَّهُۥ عَيْنَيْنِ","Bukankah Kami telah menjadikan untuknya sepasang mata","Have We not made for him two eyes"],["وَلِسَانًا وَشَفَتَيْنِ","dan lidah dan sepasang bibir","And a tongue and two lips"],["وَهَدَيْنَـٰهُ ٱلنَّجْدَيْنِ","Dan Kami telah menunjukkan kepadanya dua jalan (kebajikkan dan kejahatan)","And have shown him the two ways"],["فَلَا ٱقْتَحَمَ ٱلْعَقَبَةَ","Tetapi dia tidak menempuh jalan yang mendaki dan sukar","But he has not broken through the difficult pass"],["وَمَآ أَدْرَىٰكَ مَا ٱلْعَقَبَةُ","Dan tahukah kamu apakah jalan yang mendaki dan sukar itu","And what can make you know what is [breaking through] the difficult pass"],["فَكُّ رَقَبَةٍ","(Yaitu) membebaskan budak (hamba sahaya)","It is the freeing of a slave"],["أَوْ إِطْعَـٰمٌ فِي يَوْمٍ ذِي مَسْغَبَةٍ","atau memberi makan pada hari terjadi kelaparan","Or feeding on a day of severe hunger"],["يَتِيمًا ذَا مَقْرَبَةٍ","(kepada) anak yatim yang ada hubungan kerabat","An orphan of near relationship"],["أَوْ مِسْكِينًا ذَا مَتْرَبَةٍ","atau orang miskin yang sangat fakir","Or a needy person in misery"],["ثُمَّ كَانَ مِنَ ٱلَّذِينَ ءَامَنُواْ وَتَوَاصَوْاْ بِٱلصَّبْرِ وَتَوَاصَوْاْ بِٱلْمَرْحَمَةِ","Kemudian dia termasuk orang-orang yang beriman, dan saling berpesan untuk bersabar dan saling berpesan untuk berkasih sayang","And then being among those who believed and advised one another to patience and advised one another to compassion"],["أُوْلَـٰٓئِكَ أَصْحَـٰبُ ٱلْمَيْمَنَةِ","Mereka (orang-orang yang beriman dan saling berpesan itu) adalah golongan kanan","Those are the companions of the right"],["وَٱلَّذِينَ كَفَرُواْ بِـَٔايَـٰتِنَا هُمْ أَصْحَـٰبُ ٱلْمَشْـَٔمَةِ","Dan orang-orang yang kafir kepada ayat-ayat Kami, mereka itu adalah golongan kiri","But they who disbelieved in Our signs - those are the companions of the left"],["عَلَيْهِمْ نَارٌ مُّؤْصَدَةُۢ","Mereka berada dalam neraka yang ditutup rapat","Over them will be fire closed in"]]},{"n":"Asy-Syams","a":[["وَٱلشَّمْسِ وَضُحَىٰهَا","Demi matahari dan sinarnya pada pagi hari","By the sun and its brightness"],["وَٱلْقَمَرِ إِذَا تَلَىٰهَا","demi bulan apabila mengiringinya","And [by] the moon when it follows it"],["وَٱلنَّهَارِ إِذَا جَلَّىٰهَا","demi siang apabila menampakkannya","And [by] the day when it displays it"],["وَٱلَّيْلِ إِذَا يَغْشَىٰهَا","demi malam apabila menutupinya (gelap gulita)","And [by] the night when it covers it"],["وَٱلسَّمَآءِ وَمَا بَنَىٰهَا","demi langit serta perancangannya (yang menakjubkan)","And [by] the sky and He who constructed it"],["وَٱلْأَرْضِ وَمَا طَحَىٰهَا","demi bumi serta penghamparannya","And [by] the earth and He who spread it"],["وَنَفْسٍ وَمَا سَوَّىٰهَا","demi jiwa serta penyempurnaan (ciptaan)nya","And [by] the soul and He who proportioned it"],["فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَىٰهَا","maka Dia mengilhamkan kepadanya (jalan) kejahatan dan ketakwaannya","And inspired it [with discernment of] its wickedness and its righteousness"],["قَدْ أَفْلَحَ مَن زَكَّىٰهَا","sungguh beruntung orang yang menyucikannya (jiwa itu)","He has succeeded who purifies it"],["وَقَدْ خَابَ مَن دَسَّىٰهَا","dan sungguh rugi orang yang mengotorinya","And he has failed who instills it [with corruption]"],["كَذَّبَتْ ثَمُودُ بِطَغْوَىٰهَآ","(Kaum) Samud telah mendustakan (rasulnya) karena mereka melampaui batas (zalim)","Thamud denied [their prophet] by reason of their transgression"],["إِذِ ٱنۢبَعَثَ أَشْقَىٰهَا","ketika bangkit orang yang paling celaka di antara mereka","When the most wretched of them was sent forth"],["فَقَالَ لَهُمْ رَسُولُ ٱللَّهِ نَاقَةَ ٱللَّهِ وَسُقْيَـٰهَا","lalu Rasul Allah (Saleh) berkata kepada mereka, \"(Biarkanlah) unta betina dari Allah ini dengan minumannya","And the messenger of Allah [Salih] said to them, \"[Do not harm] the she-camel of Allah or [prevent her from] her drink"],["فَكَذَّبُوهُ فَعَقَرُوهَا فَدَمْدَمَ عَلَيْهِمْ رَبُّهُم بِذَنۢبِهِمْ فَسَوَّىٰهَا","Namun mereka mendustakannya dan menyembelihnya, karena itu Tuhan membinasakan mereka karena dosanya, lalu diratakan-Nya (dengan tanah)","But they denied him and hamstrung her. So their Lord brought down upon them destruction for their sin and made it equal [upon all of them]"],["وَلَا يَخَافُ عُقْبَـٰهَا","Dan Dia tidak takut terhadap akibatnya","And He does not fear the consequence thereof"]]},{"n":"Al-Layl","a":[["وَٱلَّيْلِ إِذَا يَغْشَىٰ","Demi malam apabila menutupi (cahaya siang)","By the night when it covers"],["وَٱلنَّهَارِ إِذَا تَجَلَّىٰ","demi siang bila terang benderang","And [by] the day when it appears"],["وَمَا خَلَقَ ٱلذَّكَرَ وَٱلْأُنثَىٰٓ","demi penciptaan laki-laki dan perempuan","And [by] He who created the male and female"],["إِنَّ سَعْيَكُمْ لَشَتَّىٰ","sungguh, usahamu memang beraneka macam","Indeed, your efforts are diverse"],["فَأَمَّا مَنْ أَعْطَىٰ وَٱتَّقَىٰ","Maka barangsiapa memberikan (hartanya di jalan Allah) dan bertakwa","As for he who gives and fears Allah"],["وَصَدَّقَ بِٱلْحُسْنَىٰ","dan membenarkan (adanya pahala) yang terbaik (surga)","And believes in the best [reward]"],["فَسَنُيَسِّرُهُۥ لِلْيُسْرَىٰ","maka akan Kami mudahkan baginya jalan menuju kemudahan (kebahagiaan)","We will ease him toward ease"],["وَأَمَّا مَنۢ بَخِلَ وَٱسْتَغْنَىٰ","Dan adapun orang yang kikir dan merasa dirinya cukup (tidak perlu pertolongan Allah)","But as for he who withholds and considers himself free of need"],["وَكَذَّبَ بِٱلْحُسْنَىٰ","serta mendustakan (pahala) yang terbaik","And denies the best [reward]"],["فَسَنُيَسِّرُهُۥ لِلْعُسْرَىٰ","maka akan Kami mudahkan baginya jalan menuju kesukaran (kesengsaraan)","We will ease him toward difficulty"],["وَمَا يُغْنِي عَنْهُ مَالُهُۥٓ إِذَا تَرَدَّىٰٓ","Dan hartanya tidak bermanfaat baginya apabila dia telah binasa","And what will his wealth avail him when he falls"],["إِنَّ عَلَيْنَا لَلْهُدَىٰ","Sesungguhnya Kami lah yang memberi petunjuk","Indeed, [incumbent] upon Us is guidance"],["وَإِنَّ لَنَا لَلْأٓخِرَةَ وَٱلْأُولَىٰ","dan sesungguhnya milik Kami lah akhirat dan dunia","And indeed, to Us belongs the Hereafter and the first [life]"],["فَأَنذَرْتُكُمْ نَارًا تَلَظَّىٰ","Maka aku memperingatkan kamu dengan neraka yang menyala-nyala","So I have warned you of a Fire which is blazing"],["لَا يَصْلَىٰهَآ إِلَّا ٱلْأَشْقَى","yang hanya dimasuki oleh orang yang paling celaka","None will [enter to] burn therein except the most wretched one"],["ٱلَّذِي كَذَّبَ وَتَوَلَّىٰ","yang mendustakan (kebenaran) dan berpaling (dari iman)","Who had denied and turned away"],["وَسَيُجَنَّبُهَا ٱلْأَتْقَى","Dan akan dijauhkan darinya (neraka) orang yang paling bertakwa","But the righteous one will avoid it"],["ٱلَّذِي يُؤْتِي مَالَهُۥ يَتَزَكَّىٰ","yang menginfakkan hartanya (di jalan Allah) untuk membersihkan (dirinya)","[He] who gives [from] his wealth to purify himself"],["وَمَا لِأَحَدٍ عِندَهُۥ مِن نِّعْمَةٍ تُجْزَىٰٓ","dan tidak ada seorang pun memberikan suatu nikmat padanya yang harus dibalasnya","And not [giving] for anyone who has [done him] a favor to be rewarded"],["إِلَّا ٱبْتِغَآءَ وَجْهِ رَبِّهِ ٱلْأَعْلَىٰ","tetapi (dia memberikan itu semata-mata) karena mencari keridaan Tuhannya Yang Mahatinggi","But only seeking the countenance of his Lord, Most High"],["وَلَسَوْفَ يَرْضَىٰ","Dan niscaya kelak dia akan mendapat kesenangan (yang sempurna)","And he is going to be satisfied"]]},{"n":"Ad-Duhaa","a":[["وَٱلضُّحَىٰ","Demi waktu duha (ketika matahari naik sepenggalan)","By the morning brightness"],["وَٱلَّيْلِ إِذَا سَجَىٰ","dan demi malam apabila telah sunyi","And [by] the night when it covers with darkness"],["مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ","Tuhanmu tidak meninggalkan engkau (Muhammad) dan tidak (pula) membencimu","Your Lord has not taken leave of you, [O Muhammad], nor has He detested [you]"],["وَلَلْأٓخِرَةُ خَيْرٌ لَّكَ مِنَ ٱلْأُولَىٰ","dan sungguh, yang kemudian itu lebih baik bagimu daripada yang permulaan","And the Hereafter is better for you than the first [life]"],["وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰٓ","Dan sungguh, kelak Tuhanmu pasti memberikan karunia-Nya kepadamu, sehingga engkau menjadi puas","And your Lord is going to give you, and you will be satisfied"],["أَلَمْ يَجِدْكَ يَتِيمًا فَـَٔاوَىٰ","Bukankah Dia mendapatimu sebagai seorang yatim, lalu Dia melindungi(mu)","Did He not find you an orphan and give [you] refuge"],["وَوَجَدَكَ ضَآلًّا فَهَدَىٰ","(Dan Dia mendapatimu sebagai seorang yang bingung,912) lalu Dia memberikan petunjuk","And He found you lost and guided [you]"],["وَوَجَدَكَ عَآئِلًا فَأَغْنَىٰ","Dan Dia mendapatimu sebagai seorang yang kekurangan, lalu Dia memberikan kecukupan","And He found you poor and made [you] self-sufficient"],["فَأَمَّا ٱلْيَتِيمَ فَلَا تَقْهَرْ","Maka terhadap anak yatim janganlah engkau berlaku sewenang-wenang","So as for the orphan, do not oppress [him]"],["وَأَمَّا ٱلسَّآئِلَ فَلَا تَنْهَرْ","Dan terhadap orang yang meminta-minta, janganlah engkau menghardik(nya)","And as for the petitioner, do not repel [him]"],["وَأَمَّا بِنِعْمَةِ رَبِّكَ فَحَدِّثْ","Dan terhadap nikmat Tuhanmu, hendaklah engkau nyatakan (dengan bersyukur)","But as for the favor of your Lord, report [it]"]]},{"n":"Asy-Syarh","a":[["أَلَمْ نَشْرَحْ لَكَ صَدْرَكَ","Bukankah kami telah melapangkan dadamu (Muhammad)","Did We not expand for you, [O Muhammad], your breast"],["وَوَضَعْنَا عَنكَ وِزْرَكَ","dan kami pun telah menurunkan beban darimu","And We removed from you your burden"],["ٱلَّذِيٓ أَنقَضَ ظَهْرَكَ","yang memberatkan punggungmu","Which had weighed upon your back"],["وَرَفَعْنَا لَكَ ذِكْرَكَ","dan kami tinggikan sebutan (nama)mu914) bagimu","And raised high for you your repute"],["فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","Maka sesungguhnya bersama kesulitan ada kemudahan","For indeed, with hardship [will be] ease"],["إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا","sesungguhnya bersama kesulitan ada kemudahan","Indeed, with hardship [will be] ease"],["فَإِذَا فَرَغْتَ فَٱنصَبْ","Maka apabila engkau telah selesai (dari suatu urusan), tetaplah bekerja keras (untuk urusan yang lain)","So when you have finished [your duties], then stand up [for worship]"],["وَإِلَىٰ رَبِّكَ فَٱرْغَب","dan hanya kepada Tuhanmulah engkau berharap","And to your Lord direct [your] longing"]]},{"n":"At-Tin","a":[["وَٱلتِّينِ وَٱلزَّيْتُونِ","Demi (buah) Tin dan (buah) Zaitun","By the fig and the olive"],["وَطُورِ سِينِينَ","demi gunung Sinai","And [by] Mount Sinai"],["وَهَـٰذَا ٱلْبَلَدِ ٱلْأَمِينِ","dan demi negeri (Mekkah) yang aman ini","And [by] this secure city [Makkah]"],["لَقَدْ خَلَقْنَا ٱلْإِنسَـٰنَ فِيٓ أَحْسَنِ تَقْوِيمٍ","Sungguh, Kami telah menciptakan manusia dalam bentuk yang sebaik-baiknya","We have certainly created man in the best of stature"],["ثُمَّ رَدَدْنَـٰهُ أَسْفَلَ سَـٰفِلِينَ","kemudian Kami kembalikan dia ke tempat yang serendah-rendahnya","Then We return him to the lowest of the low"],["إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَـٰتِ فَلَهُمْ أَجْرٌ غَيْرُ مَمْنُونٍ","kecuali orang-orang yang beriman dan mengerjakan kebajikan; maka mereka akan mendapat pahala yang tidak ada putus-putusnya","Except for those who believe and do righteous deeds, for they will have a reward uninterrupted"],["فَمَا يُكَذِّبُكَ بَعْدُ بِٱلدِّينِ","Maka apa yang menyebabkan (mereka) mendustakanmu (tentang) hari pembalasan setelah (adanya keterangan-keterangan) itu","So what yet causes you to deny the Recompense"],["أَلَيْسَ ٱللَّهُ بِأَحْكَمِ ٱلْحَـٰكِمِينَ","Bukankah Allah Hakim yang paling adil","Is not Allah the most just of judges"]]},{"n":"Al-'Alaq","a":[["ٱقْرَأْ بِٱسْمِ رَبِّكَ ٱلَّذِي خَلَقَ","Bacalah dengan (menyebut) nama Tuhanmu yang menciptakan","Recite in the name of your Lord who created"],["خَلَقَ ٱلْإِنسَـٰنَ مِنْ عَلَقٍ","Dia telah menciptakan manusia dari segumpal darah","Created man from a clinging substance"],["ٱقْرَأْ وَرَبُّكَ ٱلْأَكْرَمُ","Bacalah, dan Tuhanmulah Yang Mahamulia","Recite, and your Lord is the most Generous"],["ٱلَّذِي عَلَّمَ بِٱلْقَلَمِ","Yang mengajar (manusia) dengan pena","Who taught by the pen"],["عَلَّمَ ٱلْإِنسَـٰنَ مَا لَمْ يَعْلَمْ","Dia mengajarkan manusia apa yang tidak diketahuinya","Taught man that which he knew not"],["كَلَّآ إِنَّ ٱلْإِنسَـٰنَ لَيَطْغَىٰٓ","Sekali-sekali tidak! Sungguh, manusia itu benar-benar melampaui batas","No! [But] indeed, man transgresses"],["أَن رَّءَاهُ ٱسْتَغْنَىٰٓ","apabila melihat dirinya serba cukup","Because he sees himself self-sufficient"],["إِنَّ إِلَىٰ رَبِّكَ ٱلرُّجْعَىٰٓ","Sungguh, hanya kepada Tuhanmulah tempat kembali(mu)","Indeed, to your Lord is the return"],["أَرَءَيْتَ ٱلَّذِي يَنْهَىٰ","Bagaimana pendapatmu tentang orang yang melarang","Have you seen the one who forbids"],["عَبْدًا إِذَا صَلَّىٰٓ","seorang hamba ketika dia melaksanakan salat","A servant when he prays"],["أَرَءَيْتَ إِن كَانَ عَلَى ٱلْهُدَىٰٓ","bagaimana pendapatmu jika dia (yang dilarang salat itu) berada di atas kebenaran (petunjuk)","Have you seen if he is upon guidance"],["أَوْ أَمَرَ بِٱلتَّقْوَىٰٓ","atau dia menyuruh bertakwa (kepada Allah)","Or enjoins righteousness"],["أَرَءَيْتَ إِن كَذَّبَ وَتَوَلَّىٰٓ","Bagaimana pendapatmu jika dia (yang melarang) itu mendustakan dan berpaling","Have you seen if he denies and turns away"],["أَلَمْ يَعْلَم بِأَنَّ ٱللَّهَ يَرَىٰ","Tidakkah dia mengetahui bahwa sesungguhnya Allah melihat (segala perbuatannya)","Does he not know that Allah sees"],["كَلَّا لَئِن لَّمْ يَنتَهِ لَنَسْفَعَۢا بِٱلنَّاصِيَةِ","Sekali-kali tidak! Sungguh, jika dia tidak berhenti (berbuat demikian) niscaya Kami tarik ubun-ubunnya (ke dalam neraka)","No! If he does not desist, We will surely drag him by the forelock"],["نَاصِيَةٍ كَـٰذِبَةٍ خَاطِئَةٍ","(yaitu) ubun-ubun orang yang mendustakan dan durhaka","A lying, sinning forelock"],["فَلْيَدْعُ نَادِيَهُۥ","Maka biarlah dia memanggil golongannya (untuk menolongnya)","Then let him call his associates"],["سَنَدْعُ ٱلزَّبَانِيَةَ","kelak Kami akan memanggil Malaikat Zabaniyah (penyiksa orang-orang yang berdosa)","We will call the angels of Hell"],["كَلَّا لَا تُطِعْهُ وَٱسْجُدْۤ وَٱقْتَرِب۩","sekali-kali tidak! Janganlah kamu patuh kepadanya; dan sujudlah serta dekatkanlah (dirimu kepada Allah)","No! Do not obey him. But prostrate and draw near [to Allah]"]]},{"n":"Al-Qadr","a":[["إِنَّآ أَنزَلْنَـٰهُ فِي لَيْلَةِ ٱلْقَدْرِ","Sesungguhnya Kami telah menurunkannya (Alquran) pada malam qadar","Indeed, We sent the Qur'an down during the Night of Decree"],["وَمَآ أَدْرَىٰكَ مَا لَيْلَةُ ٱلْقَدْرِ","Dan tahukah kamu apakah malam kemuliaan itu","And what can make you know what is the Night of Decree"],["لَيْلَةُ ٱلْقَدْرِ خَيْرٌ مِّنْ أَلْفِ شَهْرٍ","Malam kemuliaan itu lebih baik daripada seribu bulan","The Night of Decree is better than a thousand months"],["تَنَزَّلُ ٱلْمَلَـٰٓئِكَةُ وَٱلرُّوحُ فِيهَا بِإِذْنِ رَبِّهِم مِّن كُلِّ أَمْرٍ","Pada malam itu turun para malaikat dan Ruh (Jibril) dengan izin Tuhannya untuk mengatur semua urusan","The angels and the Spirit descend therein by permission of their Lord for every matter"],["سَلَـٰمٌ هِيَ حَتَّىٰ مَطْلَعِ ٱلْفَجْرِ","Sejahteralah (malam itu) sampai terbit fajar","Peace it is until the emergence of dawn"]]},{"n":"Al-Bayyinah","a":[["لَمْ يَكُنِ ٱلَّذِينَ كَفَرُواْ مِنْ أَهْلِ ٱلْكِتَـٰبِ وَٱلْمُشْرِكِينَ مُنفَكِّينَ حَتَّىٰ تَأْتِيَهُمُ ٱلْبَيِّنَةُ","Orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik tidak akan meninggalkan (agama mereka) sampai datang kepada mereka bukti yang nyata","Those who disbelieved among the People of the Scripture and the polytheists were not to be parted [from misbelief] until there came to them clear evidence"],["رَسُولٌ مِّنَ ٱللَّهِ يَتْلُواْ صُحُفًا مُّطَهَّرَةً","(yaitu) seorang Rasul dari Allah (Muhammad) yang membacakan lembaran-lembaran yang suci (Alquran)","A Messenger from Allah, reciting purified scriptures"],["فِيهَا كُتُبٌ قَيِّمَةٌ","di dalamnya terdapat (isi) kitab-kitab yang lurus (benar)","Within which are correct writings"],["وَمَا تَفَرَّقَ ٱلَّذِينَ أُوتُواْ ٱلْكِتَـٰبَ إِلَّا مِنۢ بَعْدِ مَا جَآءَتْهُمُ ٱلْبَيِّنَةُ","Dan tidaklah terpecah belah orang-orang Ahli Kitab melainkan setelah datang kepada mereka bukti yang nyata","Nor did those who were given the Scripture become divided until after there had come to them clear evidence"],["وَمَآ أُمِرُوٓاْ إِلَّا لِيَعْبُدُواْ ٱللَّهَ مُخْلِصِينَ لَهُ ٱلدِّينَ حُنَفَآءَ وَيُقِيمُواْ ٱلصَّلَوٰةَ وَيُؤْتُواْ ٱلزَّكَوٰةَۚ وَذَـٰلِكَ دِينُ ٱلْقَيِّمَةِ","Padahal mereka hanya diperintah menyembah Allah dengan ikhlas menaati-Nya semata-mata karena (menjalankan) agama, dan juga agar melaksanakan salat dan menunaikan zakat; dan yang demikian itulah agama yang lurus (benar)","And they were not commanded except to worship Allah, [being] sincere to Him in religion, inclining to truth, and to establish prayer and to give zakah. And that is the correct religion"],["إِنَّ ٱلَّذِينَ كَفَرُواْ مِنْ أَهْلِ ٱلْكِتَـٰبِ وَٱلْمُشْرِكِينَ فِي نَارِ جَهَنَّمَ خَـٰلِدِينَ فِيهَآۚ أُوْلَـٰٓئِكَ هُمْ شَرُّ ٱلْبَرِيَّةِ","Sungguh, orang-orang yang kafir dari golongan Ahli Kitab dan orang-orang musyrik (akan masuk) ke neraka Jahanam; mereka kekal di dalamnya selama-lamanya. Mereka itu adalah sejahat-jahat makhluk","Indeed, they who disbelieved among the People of the Scripture and the polytheists will be in the fire of Hell, abiding eternally therein. Those are the worst of creatures"],["إِنَّ ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَـٰتِ أُوْلَـٰٓئِكَ هُمْ خَيْرُ ٱلْبَرِيَّةِ","Sungguh, orang-orang yang beriman dan mengerjakan kebajikan, mereka itulah sebaik-baik makhluk","Indeed, they who have believed and done righteous deeds - those are the best of creatures"],["جَزَآؤُهُمْ عِندَ رَبِّهِمْ جَنَّـٰتُ عَدْنٍ تَجْرِي مِن تَحْتِهَا ٱلْأَنْهَـٰرُ خَـٰلِدِينَ فِيهَآ أَبَدًاۖ رَّضِيَ ٱللَّهُ عَنْهُمْ وَرَضُواْ عَنْهُۚ ذَـٰلِكَ لِمَنْ خَشِيَ رَبَّهُۥ","Balasan mereka di sisi Tuhan mereka ialah surga 'Ādn yang mengalir di bawahnya sungai-sungai; mereka kekal di dalamnya selama-lamanya. Allah rida terhadap mereka dan mereka pun rida kepada-Nya. Yang demikian itu adalah (balasan) bagi orang yang takut kepada Tuhannya","Their reward with Allah will be gardens of perpetual residence beneath which rivers flow, wherein they will abide forever, Allah being pleased with them and they with Him. That is for whoever has feared his Lord"]]},{"n":"Az-Zalzalah","a":[["إِذَا زُلْزِلَتِ ٱلْأَرْضُ زِلْزَالَهَا","Apabila bumi diguncangkan dengan guncangan yang dahsyat","When the earth is shaken with its [final] earthquake"],["وَأَخْرَجَتِ ٱلْأَرْضُ أَثْقَالَهَا","dan bumi telah mengeluarkan beban-beban berat (yang dikandung)nya","And the earth discharges its burdens"],["وَقَالَ ٱلْإِنسَـٰنُ مَا لَهَا","dan manusia bertanya, \"Apa yang terjadi pada bumi ini","And man says, \"What is [wrong] with it"],["يَوْمَئِذٍ تُحَدِّثُ أَخْبَارَهَا","Pada hari itu bumi menyampaikan beritanya","That Day, it will report its news"],["بِأَنَّ رَبَّكَ أَوْحَىٰ لَهَا","karena sesungguhnya Tuhanmu telah memerintahkan (yang sedemikian itu) padanya","Because your Lord has commanded it"],["يَوْمَئِذٍ يَصْدُرُ ٱلنَّاسُ أَشْتَاتًا لِّيُرَوْاْ أَعْمَـٰلَهُمْ","(Pada hari itu manusia keluar dari kuburnya dalam keadaan berkelompok-kelompok,922) untuk diperlihatkan kepada mereka (balasan) semua amal perbuatannya","That Day, the people will depart separated [into categories] to be shown [the result of] their deeds"],["فَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُۥ","Maka barangsiapa mengerjakan kebaikan seberat zarah, niscaya dia akan melihat (balasan)nya","So whoever does an atom's weight of good will see it"],["وَمَن يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُۥ","Dan barangsiapa mengerjakan kejahatan seberat zarah, niscaya dia akan melihat (balasan)nya","And whoever does an atom's weight of evil will see it"]]},{"n":"Al-'Adiyat","a":[["وَٱلْعَـٰدِيَـٰتِ ضَبْحًا","Demi kuda perang yang berlari kencang terengah-engah","By the racers, panting"],["فَٱلْمُورِيَـٰتِ قَدْحًا","dan kuda yang memercikkan bunga api (dengan pukulan kuku kakinya)","And the producers of sparks [when] striking"],["فَٱلْمُغِيرَـٰتِ صُبْحًا","dan kuda yang menyerang (dengan tiba-tiba) pada waktu pagi","And the chargers at dawn"],["فَأَثَرْنَ بِهِۦ نَقْعًا","sehingga menerbangkan debu","Stirring up thereby [clouds of] dust"],["فَوَسَطْنَ بِهِۦ جَمْعًا","lalu menyerbu ke tengah-tengah kumpulan musuh","Arriving thereby in the center collectively"],["إِنَّ ٱلْإِنسَـٰنَ لِرَبِّهِۦ لَكَنُودٌ","sungguh, manusia itu sangat ingkar, (tidak bersyukur) kepada Tuhannya","Indeed mankind, to his Lord, is ungrateful"],["وَإِنَّهُۥ عَلَىٰ ذَـٰلِكَ لَشَهِيدٌ","dan sesungguhnya dia (manusia) menyaksikan (mengakui) keingkarannya","And indeed, he is to that a witness"],["وَإِنَّهُۥ لِحُبِّ ٱلْخَيْرِ لَشَدِيدٌ","dan sesungguhnya cintanya kepada harta benar-benar berlebihan","And indeed he is, in love of wealth, intense"],["۞أَفَلَا يَعْلَمُ إِذَا بُعْثِرَ مَا فِي ٱلْقُبُورِ","Maka tidakkah dia mengetahui apabila apa yang di dalam kubur dikeluarkan","But does he not know that when the contents of the graves are scattered"],["وَحُصِّلَ مَا فِي ٱلصُّدُورِ","dan apa yang tersimpan di dalam dada dikeluarkan","And that within the breasts is obtained"],["إِنَّ رَبَّهُم بِهِمْ يَوْمَئِذٍ لَّخَبِيرُۢ","sungguh, Tuhan mereka pada hari itu Mahateliti terhadap keadaan mereka","Indeed, their Lord with them, that Day, is [fully] Acquainted"]]},{"n":"Al-Qari'ah","a":[["ٱلْقَارِعَةُ","Hari Kiamat","The Striking Calamity"],["مَا ٱلْقَارِعَةُ","Apakah hari Kiamat itu","What is the Striking Calamity"],["وَمَآ أَدْرَىٰكَ مَا ٱلْقَارِعَةُ","Dan tahukah kamu apakah hari Kiamat itu","And what can make you know what is the Striking Calamity"],["يَوْمَ يَكُونُ ٱلنَّاسُ كَٱلْفَرَاشِ ٱلْمَبْثُوثِ","Pada hari itu manusia seperti laron yang beterbangan","It is the Day when people will be like moths, dispersed"],["وَتَكُونُ ٱلْجِبَالُ كَٱلْعِهْنِ ٱلْمَنفُوشِ","dan gunung-gunung seperti bulu yang dihambur-hamburkan","And the mountains will be like wool, fluffed up"],["فَأَمَّا مَن ثَقُلَتْ مَوَـٰزِينُهُۥ","Maka adapun orang yang berat timbangan (kebaikan)nya","Then as for one whose scales are heavy [with good deeds]"],["فَهُوَ فِي عِيشَةٍ رَّاضِيَةٍ","maka dia berada dalam kehidupan yang memuaskan (senang)","He will be in a pleasant life"],["وَأَمَّا مَنْ خَفَّتْ مَوَـٰزِينُهُۥ","Dan adapun orang yang ringan timbangan (kebaikan)nya","But as for one whose scales are light"],["فَأُمُّهُۥ هَاوِيَةٌ","maka tempat kembalinya adalah neraka
