 Hāwiyah","His refuge will be an abyss"],["وَمَآ أَدْرَىٰكَ مَا هِيَهْ","Dan tahukah kamu apakah neraka Hāwiyah itu","And what can make you know what that is"],["نَارٌ حَامِيَةُۢ","(Yaitu) api yang sangat panas","It is a Fire, intensely hot"]]},{"n":"At-Takasur","a":[["أَلْهَىٰكُمُ ٱلتَّكَاثُرُ","Bermegah-megahan telah melalaikan kamu","Competition in [worldly] increase diverts you"],["حَتَّىٰ زُرْتُمُ ٱلْمَقَابِرَ","sampai kamu masuk ke dalam kubur","Until you visit the graveyards"],["كَلَّا سَوْفَ تَعْلَمُونَ","Sekali-kali tidak! Kelak kamu akan mengetahui (akibat perbuatanmu itu)","No! You are going to know"],["ثُمَّ كَلَّا سَوْفَ تَعْلَمُونَ","kemudian sekali-kali tidak! Kelak kamu akan mengetahui","Then no! You are going to know"],["كَلَّا لَوْ تَعْلَمُونَ عِلْمَ ٱلْيَقِينِ","Sekali-kali tidak! Sekiranya kamu mengetahui dengan pasti","No! If you only knew with knowledge of certainty"],["لَتَرَوُنَّ ٱلْجَحِيمَ","niscaya kamu benar-benar akan melihat neraka Jahim","You will surely see the Hellfire"],["ثُمَّ لَتَرَوُنَّهَا عَيْنَ ٱلْيَقِينِ","kemudian kamu benar-benar akan melihatnya dengan mata kepala sendiri","Then you will surely see it with the eye of certainty"],["ثُمَّ لَتُسْـَٔلُنَّ يَوْمَئِذٍ عَنِ ٱلنَّعِيمِ","kemudian kamu benar-benar akan ditanya pada hari itu tentang kenikmatan (yang megah di dunia itu)","Then you will surely be asked that Day about pleasure"]]},{"n":"Al-'Asr","a":[["وَٱلْعَصْرِ","Demi masa","By time"],["إِنَّ ٱلْإِنسَـٰنَ لَفِي خُسْرٍ","Sungguh, manusia berada dalam kerugian","Indeed, mankind is in loss"],["إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَـٰتِ وَتَوَاصَوْاْ بِٱلْحَقِّ وَتَوَاصَوْاْ بِٱلصَّبْرِ","kecuali orang-orang yang beriman dan mengerjakan kebajikan serta saling menasihati untuk kebenaran dan saling menasihati untuk kesabaran","Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience"]]},{"n":"Al-Humazah","a":[["وَيْلٌ لِّكُلِّ هُمَزَةٍ لُّمَزَةٍ","Celakalah bagi setiap pengumpat dan pencela","Woe to every scorner and mocker"],["ٱلَّذِي جَمَعَ مَالًا وَعَدَّدَهُۥ","yang mengumpulkan harta dan menghitung-hitungnya","Who collects wealth and [continuously] counts it"],["يَحْسَبُ أَنَّ مَالَهُۥٓ أَخْلَدَهُۥ","dia (manusia) mengira bahwa hartanya itu dapat mengekalkannya","He thinks that his wealth will make him immortal"],["كَلَّاۖ لَيُنۢبَذَنَّ فِي ٱلْحُطَمَةِ","Sekali-kali tidak! Pasti dia akan dilemparkan ke dalam (neraka) Ḥuṭamah","No! He will surely be thrown into the Crusher"],["وَمَآ أَدْرَىٰكَ مَا ٱلْحُطَمَةُ","Dan tahukah kamu apakah (neraka) Ḥuṭamah itu","And what can make you know what is the Crusher"],["نَارُ ٱللَّهِ ٱلْمُوقَدَةُ","(Yaitu) api (azab) Allah yang dinyalakan","It is the fire of Allah, [eternally] fueled"],["ٱلَّتِي تَطَّلِعُ عَلَى ٱلْأَفْـِٔدَةِ","yang (membakar) sampai ke hati","Which mounts directed at the hearts"],["إِنَّهَا عَلَيْهِم مُّؤْصَدَةٌ","Sungguh, api itu ditutup rapat atas (diri) mereka","Indeed, Hellfire will be closed down upon them"],["فِي عَمَدٍ مُّمَدَّدَةِۭ","(sedang mereka itu) diikat pada tiang-tiang yang panjang","In extended columns"]]},{"n":"Al-Fil","a":[["أَلَمْ تَرَ كَيْفَ فَعَلَ رَبُّكَ بِأَصْحَـٰبِ ٱلْفِيلِ","Tidakkah engkau (Muhammad) perhatikan bagaimana Tuhanmu telah bertindak terhadap pasukan bergajah","Have you not considered, [O Muhammad], how your Lord dealt with the companions of the elephant"],["أَلَمْ يَجْعَلْ كَيْدَهُمْ فِي تَضْلِيلٍ","Bukankah Dia telah menjadikan tipu daya mereka itu sia-sia","Did He not make their plan into misguidance"],["وَأَرْسَلَ عَلَيْهِمْ طَيْرًا أَبَابِيلَ","dan Dia mengirimkan kepada mereka burung yang berbondong-bondong","And He sent against them birds in flocks"],["تَرْمِيهِم بِحِجَارَةٍ مِّن سِجِّيلٍ","yang melempari mereka dengan batu dari tanah liat yang dibakar","Striking them with stones of hard clay"],["فَجَعَلَهُمْ كَعَصْفٍ مَّأْكُولِۭ","sehingga mereka dijadikan-Nya seperti daun-daun yang dimakan (ulat)","And He made them like eaten straw"]]},{"n":"Quraisy","a":[["لِإِيلَـٰفِ قُرَيْشٍ","Karena kebiasaan orang-orang Quraisy","For the accustomed security of the Quraysh"],["إِۦلَـٰفِهِمْ رِحْلَةَ ٱلشِّتَآءِ وَٱلصَّيْفِ","(yaitu) kebiasaan mereka bepergian pada musim dingin dan musim panas","Their accustomed security [in] the caravan of winter and summer"],["فَلْيَعْبُدُواْ رَبَّ هَـٰذَا ٱلْبَيْتِ","Maka hendaklah mereka menyembah Tuhan (pemilik) rumah ini (Ka'bah)","Let them worship the Lord of this House"],["ٱلَّذِيٓ أَطْعَمَهُم مِّن جُوعٍ وَءَامَنَهُم مِّنْ خَوْفِۭ","yang telah memberi makanan kepada mereka untuk menghilangkan lapar dan mengamankan mereka dari rasa ketakutan","Who has fed them, [saving them] from hunger and made them safe, [saving them] from fear"]]},{"n":"Al-Ma'un","a":[["أَرَءَيْتَ ٱلَّذِي يُكَذِّبُ بِٱلدِّينِ","Tahukah kamu (orang) yang mendustakan agama","Have you seen the one who denies the Recompense"],["فَذَـٰلِكَ ٱلَّذِي يَدُعُّ ٱلْيَتِيمَ","Maka itulah orang yang menghardik anak yatim","For that is the one who drives away the orphan"],["وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلْمِسْكِينِ","dan tidak mengajak memberi makan orang miskin","And does not encourage the feeding of the poor"],["فَوَيْلٌ لِّلْمُصَلِّينَ","Maka celakalah orang yang salat","So woe to those who pray"],["ٱلَّذِينَ هُمْ عَن صَلَاتِهِمْ سَاهُونَ","(yaitu) orang-orang yang lalai terhadap salatnya","[But] who are heedless of their prayer"],["ٱلَّذِينَ هُمْ يُرَآءُونَ","yang berbuat riya","Those who make show [of their deeds]"],["وَيَمْنَعُونَ ٱلْمَاعُونَ","dan enggan (memberikan) bantuan","And withhold [simple] assistance"]]},{"n":"Al-Kausar","a":[["إِنَّآ أَعْطَيْنَـٰكَ ٱلْكَوْثَرَ","Sungguh, Kami telah memberimu (Muhammad) nikmat yang banyak","Indeed, We have granted you, [O Muhammad], al-Kawthar"],["فَصَلِّ لِرَبِّكَ وَٱنْحَرْ","Maka laksanakanlah salat karena Tuhanmu, dan berkurbanlah (sebagai ibadah dan mendekatkan diri kepada Allah)","So pray to your Lord and sacrifice [to Him alone]"],["إِنَّ شَانِئَكَ هُوَ ٱلْأَبْتَرُ","Sungguh, orang-orang yang membencimu dialah yang terputus (dari rahmat Allah)","Indeed, your enemy is the one cut off"]]},{"n":"Al-Kafirun","a":[["قُلْ يَـٰٓأَيُّهَا ٱلْكَـٰفِرُونَ","Katakanlah (Muhammad), \"Wahai orang-orang kafir","Say, \"O disbelievers"],["لَآ أَعْبُدُ مَا تَعْبُدُونَ","aku tidak akan menyembah apa yang kamu sembah","I do not worship what you worship"],["وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ","dan kamu bukan penyembah apa yang aku sembah","Nor are you worshippers of what I worship"],["وَلَآ أَنَا۠ عَابِدٌ مَّا عَبَدتُّمْ","dan aku tidak pernah menjadi penyembah apa yang kamu sembah","Nor will I be a worshipper of what you worship"],["وَلَآ أَنتُمْ عَـٰبِدُونَ مَآ أَعْبُدُ","dan kamu tidak pernah (pula) menjadi penyembah apa yang aku sembah","Nor will you be worshippers of what I worship"],["لَكُمْ دِينُكُمْ وَلِيَ دِينِ","Untukmu agamamu, dan untukku agamaku","For you is your religion, and for me is my religion"]]},{"n":"An-Nasr","a":[["إِذَا جَآءَ نَصْرُ ٱللَّهِ وَٱلْفَتْحُ","Apabila telah datang pertolongan Allah dan kemenangan","When the victory of Allah has come and the conquest"],["وَرَأَيْتَ ٱلنَّاسَ يَدْخُلُونَ فِي دِينِ ٱللَّهِ أَفْوَاجًا","dan engkau melihat manusia berbondong-bondong masuk agama Allah","And you see the people entering into the religion of Allah in multitudes"],["فَسَبِّحْ بِحَمْدِ رَبِّكَ وَٱسْتَغْفِرْهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا","maka bertasbihlah dengan memuji Tuhanmu dan mohonlah ampunan kepada-Nya. Sungguh, Dia Maha Penerima tobat","Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of repentance"]]},{"n":"Al-Lahab","a":[["تَبَّتْ يَدَآ أَبِي لَهَبٍ وَتَبَّ","Binasalah kedua tangan Abu Lahab dan benar-benar binasa dia","May the hands of Abu Lahab be ruined, and ruined is he"],["مَآ أَغْنَىٰ عَنْهُ مَالُهُۥ وَمَا كَسَبَ","Tidaklah berguna baginya hartanya dan apa yang dia usahakan","His wealth will not avail him or that which he gained"],["سَيَصْلَىٰ نَارًا ذَاتَ لَهَبٍ","Kelak dia akan masuk ke dalam api yang bergejolak (neraka)","He will [enter to] burn in a Fire of [blazing] flame"],["وَٱمْرَأَتُهُۥ حَمَّالَةَ ٱلْحَطَبِ","Dan (begitu pula) istrinya, pembawa kayu bakar (penyebar fitnah)","And his wife [as well] - the carrier of firewood"],["فِي جِيدِهَا حَبْلٌ مِّن مَّسَدِۭ","Di lehernya ada tali dari sabut yang dipintal","Around her neck is a rope of [twisted] fiber"]]},{"n":"Al-Ikhlas","a":[["قُلْ هُوَ ٱللَّهُ أَحَدٌ","Katakanlah (Muhammad), \"Dialah Allah, Yang Maha Esa","Say, \"He is Allah, [who is] One"],["ٱللَّهُ ٱلصَّمَدُ","Allah tempat meminta segala sesuatu","Allah, the Eternal Refuge"],["لَمْ يَلِدْ وَلَمْ يُولَدْ","(Allah) tidak beranak dan tidak pula diperanakkan","He neither begets nor is born"],["وَلَمْ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ","Dan tidak ada sesuatu yang setara dengan Dia","Nor is there to Him any equivalent"]]},{"n":"Al-Falaq","a":[["قُلْ أَعُوذُ بِرَبِّ ٱلْفَلَقِ","Katakanlah, \"Aku berlindung kepada Tuhan yang menguasai subuh (fajar)","Say, \"I seek refuge in the Lord of daybreak"],["مِن شَرِّ مَا خَلَقَ","dari kejahatan (makhluk yang) Dia ciptakan","From the evil of that which He created"],["وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ","dan dari kejahatan malam apabila telah gelap gulita","And from the evil of darkness when it settles"],["وَمِن شَرِّ ٱلنَّفَّـٰثَـٰتِ فِي ٱلْعُقَدِ","dan dari kejahatan (perempuan-perempuan) penyihir yang meniup pada buhul-buhul (talinya)","And from the evil of the blowers in knots"],["وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ","dan dari kejahatan orang yang dengki apabila dia dengki","And from the evil of an envier when he envies"]]},{"n":"An-Nas","a":[["قُلْ أَعُوذُ بِرَبِّ ٱلنَّاسِ","Katakanlah, \"Aku berlindung kepada Tuhannya manusia","Say, \"I seek refuge in the Lord of mankind"],["مَلِكِ ٱلنَّاسِ","Raja manusia","The Sovereign of mankind"],["إِلَـٰهِ ٱلنَّاسِ","sembahan manusia","The God of mankind"],["مِن شَرِّ ٱلْوَسْوَاسِ ٱلْخَنَّاسِ","dari kejahatan (bisikan) setan yang bersembunyi","From the evil of the retreating whisperer"],["ٱلَّذِي يُوَسْوِسُ فِي صُدُورِ ٱلنَّاسِ","yang membisikkan (kejahatan) ke dalam dada manusia","Who whispers [evil] into the breasts of mankind"],["مِنَ ٱلْجِنَّةِ وَٱلنَّاسِ","dari (golongan) jin dan manusia","From among the jinn and mankind"]]}];

 document.querySelectorAll('[data-st]').forEach(e=>auHas(e.dataset.st).then(ok=>e.textContent=ok?'✓ ada':'— belum ada'))}
function toast(m){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600)}
app.addEventListener('click',e=>{const b=e.target.closest('[data-aux]');if(!b)return;const[si,i]=b.dataset.aux.split(',').map(Number),u=auUrl(si,i);auHas(u).then(ok=>ok?playId(u):toast('Audio ayat ini belum tersedia.'))});
function listen(si=0){
 app.innerHTML=`<button class="bk" onclick="home()">← Kembali</button><h1>Dengarkan Audio</h1><div class="card"><label>Surah<select id="ls2">${D.map((x,i)=>`<option value="${i}" ${i==si?'selected':''}>${78+i}. ${x.n}</option>`).join('')}</select></label><div class="hint" id="lmsg">Memeriksa audio…</div><button class="p" id="lall" hidden>▶ Putar semua ayat</button></div>${D[si].a.map((v,i)=>`<div class="card"><small>Ayat ${i+1}</small><div class="ar sm">${v[0]}</div><p class="tr">${esc(T(v))}</p><button class="opt" data-lx="${i}" disabled>Memeriksa…</button></div>`).join('')}`;
 $('#ls2').onchange=e=>listen(+e.target.value);
 Promise.all(D[si].a.map((_,i)=>auHas(auUrl(si,i)))).then(r=>{if(!$('#lall'))return;const n=r.filter(Boolean).length;
  document.querySelectorAll('[data-lx]').forEach((b,i)=>{b.disabled=!r[i];b.textContent=r[i]?'🔊 Putar ayat '+(i+1):'Audio ayat ini belum tersedia';if(r[i])b.dataset.au=auUrl(si,i)});
  $('#lmsg').textContent=n==0?'Audio surah ini belum tersedia.':n<r.length?'Audio tersedia untuk '+n+' dari '+r.length+' ayat.':'Audio lengkap tersedia.';
  if(n){$('#lall').hidden=false;$('#lall').onclick=()=>{const q=r.map((ok,i)=>ok?auUrl(si,i):null).filter(Boolean);let k=0;const go=()=>{if(k>=q.length)return;if(cur)cur.pause();cur=new Audio(q[k++]);cur.onended=go;cur.play().catch(()=>{})};go()}}})}

const FIN=30,CK=[10,20],LAD={5:12,14:22,21:27};
const bar=()=>bar0().replace(/Soal \d+\/\d+/,G.board?'Petak '+G.pos+'/'+FIN:'$&')+(G.board?boardHTML():'');
function boardHTML(){let h='';for(let r=4;r>=0;r--){let row=[];for(let c=1;c<=6;c++)row.push(r*6+c);if(r%2)row.reverse();row.forEach(n=>{const ic=n==FIN?'🏁':CK.includes(n)?'⭐':LAD[n]?'🪜'+LAD[n]:'';h+=`<div class="${n<=G.pos?'v':''} ${n==G.pos?'me':''} ${ic?'f':''}">${n==G.pos?'📖':n}<small>${ic}</small></div>`})}
 return `<div id="bd"><div class="prog"><i style="width:${Math.round(G.pos/FIN*100)}%"></i></div><div class="bd">${h}</div><div class="bm">${G.pos==0&&!G.msg?'Mulai dari petak 0. Jawab dengan benar untuk maju!':G.msg||''}</div></div>`}
function refreshBoard(){const e=$('#bd');if(e)e.outerHTML=boardHTML()}
function fwd(n){G.pos=Math.min(FIN,G.pos+n);let m='Maju '+n+' petak!';if(LAD[G.pos]){G.pos=LAD[G.pos];m='Naik tangga! 🪜'}if(CK.includes(G.pos))G.ck=G.pos;if(G.pos>=FIN){G.fin=1;m='Selamat, sampai di garis finish! 🏁'}G.msg=m;refreshBoard()}
function back(){const o=G.pos;G.pos=Math.max(G.ck,G.pos-2);G.msg=G.pos<o?'Turun '+(o-G.pos)+' petak':'Bertahan di pos ⭐';refreshBoard()}

const MM={np:[4,6,8,10,12],sec:[60,90,120,150,180]};
const memAv=(t,sr)=>{if(sr=='all')return 99;const sa=D[sr].a;let n=0;if(t=='arti'){sa.forEach(v=>{if(v[0].length<=60&&T(v).length<=90)n++});return n}for(let i=0;i<sa.length-1;){if(sa[i][0].length<=60&&sa[i+1][0].length<=60){n++;i+=2}else i++}return n};
function memSetup(t){const cf=cfg.mm=cfg.mm||{lvl:1,timer:'1',study:'0',sr:cfg.surah};if(cf.t!=t){cf.t=t;cf.study=t=='arti'?'1':'0'}const best=store.mm||{};
 const draw=()=>{const av=memAv(t,cf.sr);
 app.innerHTML=`<button class="bk" onclick="home()">← Kembali</button><h1>${t=='arti'?'AYAT &amp; ARTINYA':'KARTU PASANGAN'}</h1><div class="card"><p class="tr">${t=='arti'?'Cocokkan kartu ayat dengan kartu artinya.':'Cocokkan sebuah ayat dengan ayat lanjutannya.'} Nama surah tidak ditampilkan di kartu.</p><label>Surah<select id="msr"><option value="all">Semua surah (campur)</option>${D.map((x,i)=>`<option value="${i}">${x.n}</option>`).join('')}</select></label><p class="tr"><small>${cf.sr=='all'?'Ayat dari beberapa surah dicampur.':av<2?'Surah ini terlalu pendek untuk permainan ini. Pilih surah lain.':'Ayat tersedia untuk maksimal '+av+' pasang kartu.'}</small></p><label>Level<select id="ml">${[1,2,3,4,5].map(l=>`<option value="${l}">Level ${l} – ${Math.min(MM.np[l-1],av)*2} kartu${best[t+'-'+l]?' · '+'⭐'.repeat(best[t+'-'+l]):''}</option>`).join('')}</select></label><br><br><label>Timer<select id="mt2"><option value="1">Aktif</option><option value="0">Mati (santai)</option></select></label><br><br><label>Pelajari dulu sebelum main<select id="ms"><option value="1">Ya</option><option value="0">Tidak</option></select></label></div><button class="p" id="mgo" ${av<2?'disabled':''}>MULAI</button>`;
 $('#msr').value=cf.sr;$('#ml').value=cf.lvl;$('#mt2').value=cf.timer;$('#ms').value=cf.study;
 $('#msr').onchange=e=>{cf.sr=e.target.value;draw()};$('#ml').onchange=e=>cf.lvl=+e.target.value;$('#mt2').onchange=e=>cf.timer=e.target.value;$('#ms').onchange=e=>cf.study=e.target.value;$('#mgo').onclick=()=>memStart(t)};draw()}
function memStart(t){const cf=cfg.mm,L=cf.lvl,pool=[];
 const ok1=v=>v[0].length<=60;D.forEach((sr,si)=>{if(cf.sr!='all'&&cf.sr!=si)return;if(t=='arti')sr.a.forEach((v,i)=>{if(ok1(v)&&T(v).length<=90)pool.push({si,i})});else{const f=o=>{const r=[];for(let i=o;i<sr.a.length-1;){if(ok1(sr.a[i])&&ok1(sr.a[i+1])){r.push({si,i});i+=2}else i++}return r},x=f(0),y=f(1);pool.push(...(x.length>y.length?x:y.length>x.length?y:Math.random()<.5?x:y))}});
 const pick=sh(pool).slice(0,MM.np[L-1]);
 if(pick.length<2){toast('Surah ini terlalu pendek. Pilih "Semua surah Juz 30" di halaman utama.');return}
 const np=pick.length,sec=Math.round(MM.sec[L-1]*np/MM.np[L-1]);
 G={mem:true,mt:t,ml:L,sr:cf.sr,pairs:pick,deck:sh(pick.flatMap((q,k)=>t=='arti'?[{k,si:q.si,v:q.i,kind:'ar'},{k,si:q.si,v:q.i,kind:'tr'}]:[{k,si:q.si,v:q.i,kind:'ar'},{k,si:q.si,v:q.i+1,kind:'ar'}])),open:[],done:0,np,moves:0,score:0,streak:0,c:0,t:0,st:{},k:0,qs:[1],lock:false,total:sec,left:cf.timer=='1'?sec:null};
 cf.study=='1'?memStudy():memPlay()}
function memStudy(){
 app.innerHTML=`<button class="bk" onclick="home()">← Kembali</button><h1>HAFALKAN DULU</h1><p class="tr">Baca dan ingat pasangan berikut. Timer belum berjalan.</p>${G.pairs.map(q=>{const v=D[q.si].a[q.i];return `<div class="card"><small>${D[q.si].n} · ayat ${q.i+1}</small><div class="ar sm">${v[0]}</div>${G.mt=='arti'?`<p class="tr">${esc(T(v))}</p>`:`<small>↓ ayat ${q.i+2}</small><div class="ar sm">${D[q.si].a[q.i+1][0]}</div>`}</div>`}).join('')}<button class="p" id="mgo2">Saya siap, mulai!</button>`;
 $('#mgo2').onclick=memPlay}
function memPlay(){G.t0=Date.now();memRender();clearInterval(timer);if(G.left!=null)timer=setInterval(()=>{if(!G||!G.mem||G.over){clearInterval(timer);return}G.left--;const e=$('#mt');if(e)e.textContent='⏱ '+G.left;if(G.left<=0){clearInterval(timer);memEnd(false)}},1000)}
function memFace(c){const v=D[c.si].a[c.v];return c.kind=='tr'?`<div class="trc">${esc(T(v))}</div>`:`<div class="ar sm">${v[0]}</div>${G.mt!='arti'&&G.ml==1?'<small>ayat '+(c.v+1)+'</small>':''}`}
function memRender(){
 app.innerHTML=`<button class="bk" onclick="goHome()">← Kembali</button><p class="tr"><b>${G.sr=='all'?'Campur beberapa surah':'Surah '+D[G.sr].n}</b> · ${G.mt=='arti'?'cocokkan ayat dengan artinya':'cocokkan ayat dengan lanjutannya'}</p><div class="bar"><span>Pasangan ${G.done}/${G.np}</span><span id="mt">${G.left!=null?'⏱ '+G.left:'⏱ santai'}</span><span>Langkah ${G.moves} · Skor ${G.score}</span></div><div class="mg ${G.np>=10?'s2':''}" style="grid-template-columns:repeat(auto-fill,minmax(${G.np>=10?100:G.np>=8?120:140}px,1fr))">${G.deck.map((c,i)=>`<button class="mc ${c.up||c.ok?'up':''} ${c.ok?'ok':''}" data-mc="${i}">${c.up||c.ok?memFace(c):'❓'}</button>`).join('')}</div>`}
app.addEventListener('click',e=>{const b=e.target.closest('[data-mc]');if(!b||!G||!G.mem||G.lock||G.over)return;const i=+b.dataset.mc,c=G.deck[i];if(c.up||c.ok)return;
 c.up=true;G.open.push(i);if(G.open.length<2){memRender();return}
 const[x,y]=G.open.map(j=>G.deck[j]);G.moves++;const n=D[x.si].n;G.st[n]=G.st[n]||{c:0,t:0};G.st[n].t++;G.t++;
 if(x.k==y.k){x.ok=y.ok=true;x.up=y.up=false;G.open=[];G.done++;G.c++;G.st[n].c++;G.streak++;G.score+=10+(G.streak>=3?2:0);sfx('ok');
  if(G.done==G.np){if(G.moves<=G.np+2)G.score+=10;G.lock=true;memRender();setTimeout(()=>memEnd(true),700)}else memRender()}
 else{G.streak=0;sfx('no');G.lock=true;memRender();setTimeout(()=>{x.up=y.up=false;G.open=[];G.lock=false;if(G.mem&&!G.over)memRender()},1100)}});
function memEnd(win){if(G.over)return;G.over=true;G.k=1;clearInterval(timer);
 const sec=Math.round((Date.now()-G.t0)/1000),eff=G.moves?G.np/G.moves:0,stars=win?(eff>=.7?3:eff>=.45?2:1):0,key=G.mt+'-'+G.ml;
 for(const k in G.st){store[k]=store[k]||{c:0,t:0};store[k].c+=G.st[k].c;store[k].t+=G.st[k].t}
 if(stars){store.mm=store.mm||{};store.mm[key]=Math.max(store.mm[key]||0,stars)}
 store.hist=(store.hist||[]).concat({d:new Date().toLocaleDateString('id-ID'),s:G.score,a:G.t?Math.round(G.c/G.t*100):0}).slice(-5);save();syncBoard();
 const msg=!win?'Waktu habis. Tidak apa-apa, ayo coba lagi. Setiap usaha menjaga Al-Qur\'an itu berharga.':stars==3?'Masya Allah, Tabarakallah! Hafalanmu luar biasa. Terus jaga dan murojaah ya!':stars==2?'Alhamdulillah, bagus sekali! Sedikit lagi sempurna. Semangat murojaah!':'Barakallahu fiik! Kamu berhasil menyelesaikannya. Ulangi lagi agar hafalan makin kuat.';
 if(win)sfx('ok');
 app.innerHTML=`${win?`<div class="cf" aria-hidden="true">${Array.from({length:18},(_,i)=>`<i style="left:${(i*5.5)%98}%;animation-delay:${(i%9)*.3}s">${['✨','⭐','🌙'][i%3]}</i>`).join('')}</div>`:''}<div class="card award"><div class="trophy pop">${win?'🏆':'⏳'}</div><h1>${win?'Selamat, '+esc(NAME)+'!':'Yah, waktunya habis'}</h1>${win?`<div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div><div class="ar sm">مَا شَاءَ اللَّهُ</div>`:''}<p>${msg}</p><p><small>Skor ${G.score} · ${G.moves} langkah · ${G.done}/${G.np} pasangan · ${sec} detik</small></p></div><button class="p" id="ag">Main lagi</button>${win&&G.ml<5?`<button id="up">Naik ke level ${G.ml+1}</button>`:''}<button onclick="home()">Menu utama</button>`;
 $('#ag').onclick=()=>memStart(G.mt);const u=$('#up');if(u)u.onclick=()=>{cfg.mm.lvl=G.ml+1;memStart(G.mt)}}

caps=initCaps();NAME?home():askName();
</script>
</body>
</html>
